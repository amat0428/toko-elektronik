<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun Saya - BlueShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20 md:pb-8">

  <!-- Header -->
  <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
      <a href="index.html" class="text-base md:text-xl font-black tracking-wide flex items-center gap-1.5">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>BlueShop</span>
      </a>
      <span class="text-xs md:text-sm font-semibold border-l border-blue-400 pl-2">Akun Saya</span>
    </div>
  </header>

  <!-- Profil User -->
  <main class="max-w-xl mx-auto px-4 mt-6">
    <div class="bg-white rounded-xl p-6 shadow-sm text-center">
      <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
        <i class="fa-solid fa-user"></i>
      </div>
      <h2 class="text-lg font-bold text-gray-800">Pengguna BlueShop</h2>
      <p class="text-xs text-gray-500 mt-0.5">user@example.com</p>

      <div class="mt-6 border-t pt-4 space-y-2 text-left text-sm">
        <a href="orders.html" class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 border">
          <span class="flex items-center gap-2.5"><i class="fa-solid fa-receipt text-blue-600"></i> Pesanan Saya</span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
        </a>
        <a href="cart.html" class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 border">
          <span class="flex items-center gap-2.5"><i class="fa-solid fa-cart-shopping text-blue-600"></i> Keranjang Saya</span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
        </a>
      </div>
    </div>
  </main>

  <!-- Bottom Nav Bar HP -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-1.5 z-40 shadow-lg">
    <div class="grid grid-cols-3 text-center text-gray-500">
      <a href="index.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-0.5">Beranda</span>
      </a>
      <a href="products.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-0.5">Kategori</span>
      </a>
      <a href="orders.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-receipt text-lg"></i>
        <span class="text-[10px] mt-0.5">Pesanan</span>
      </a>
    </div>
  </nav>

</body>
</html>
