<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueShop - Toko Elektronik</title>
  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #2563eb; padding: 12px 5%; color: white; }
    .nav-container { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .logo { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .search-box { flex: 1; max-width: 400px; }
    .search-box input { width: 100%; padding: 8px 15px; border-radius: 6px; border: none; outline: none; }
    .nav-links { display: flex; gap: 15px; align-items: center; font-size: 14px; }
    .nav-links a { color: white; text-decoration: none; cursor: pointer; }
    .btn-auth { background: #10b981; color: #fff; padding: 6px 12px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .hero-banner { background: linear-gradient(135deg, #1d4ed8, #60a5fa); color: white; border-radius: 12px; padding: 30px; margin-bottom: 25px; }
    .hero-badge { background: #facc15; color: #000; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
    .hero-title { font-size: 28px; margin: 10px 0 5px 0; font-weight: 800; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #1e293b; border-bottom: 2px solid #2563eb; display: inline-block; padding-bottom: 4px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .product-card { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .product-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-name { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .product-price { color: #dc2626; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
    .btn-buy { background: #2563eb; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .admin-actions { margin-top: 8px; display: flex; gap: 5px; }
    .btn-edit { background: #10b981; color: white; border: none; padding: 5px; flex: 1; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 5px; flex: 1; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 380px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: #64748b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">🛍️ BlueShop</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari barang..." oninput="filterProducts()">
      </div>
      <div class="nav-links">
        <span id="userStatus" style="font-size: 13px; font-weight: bold;"></span>
        <button class="btn-auth" id="authBtn" onclick="openLoginModal()">Login Admin</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="hero-banner">
      <span class="hero-badge">SUPER PROMO ELEKTRONIK</span>
      <h1 class="hero-title">BLUE TECH SALE</h1>
      <p>Diskon Hingga 90% | Khusus Pengguna Terdaftar</p>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <span class="section-title">REKOMENDASI PRODUK</span>
      <button id="btnAddProduct" class="btn-save" style="display: none;" onclick="openProductModal()">+ Tambah Produk</button>
    </div>

    <div class="product-grid" id="productGrid">
      <p style="grid-column: 1/-1; text-align: center; color: #888;">Memuat produk...</p>
    </div>
  </div>

  <!-- Modal Login Admin -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Login Akun Admin</h3>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email / Username</label>
          <input type="text" id="loginUsername" placeholder="contoh: alvi@gmil.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeLoginModal()">Batal</button>
          <button type="submit" class="btn-save">Masuk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Form Tambah/Edit Produk -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h3 id="productModalTitle">Tambah Produk Baru</h3>
      <form onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="productPrice" required>
        </div>
        <div class="form-group">
          <label>URL Gambar</label>
          <input type="text" id="productImage" placeholder="https://..." required>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeProductModal()">Batal</button>
          <button type="submit" class="btn-save">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Konfigurasi Supabase (Sesuaikan dengan milikmu)
    const SUPABASE_URL = 'ISI_SUPABASE_URL_KAMU';
    const SUPABASE_KEY = 'ISI_SUPABASE_ANON_KEY_KAMU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let currentUser = JSON.parse(localStorage.getItem('blueshop_logged_user')) || null;

    // Cek Status Login Saat Halaman Dimuat
    document.addEventListener('DOMContentLoaded', () => {
      fetchProducts();
      updateAuthUI();
    });

    // Fungsi Login Mengecek Tabel 'users' di Supabase dengan aman
    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('loginUsername').value.trim();
      const passwordInput = document.getElementById('loginPassword').value.trim();

      try {
        // Menggunakan maybeSingle agar tidak memicu error fatal jika data tidak ada
        const { data, error } = await _supabase
          .from('users')
          .select('*')
          .eq('username', usernameInput)
          .eq('password', passwordInput)
          .maybeSingle();

        if (error) {
          console.error("Kesalahan Query Supabase:", error.message);
          alert('Gagal terhubung ke database.');
          return;
        }

        if (!data) {
          alert('Login gagal! Email/username atau password salah.');
          return;
        }

        // Validasi apakah role-nya Admin (case-insensitive)
        if (!data.role || data.role.toLowerCase() !== 'admin') {
          alert('Akses ditolak! Akun ini bukan akun Admin.');
          return;
        }

        // Simpan sesi login ke localStorage
        currentUser = data;
        localStorage.setItem('blueshop_logged_user', JSON.stringify(data));
        
        closeLoginModal();
        updateAuthUI();
        renderProducts(allProducts);
        alert(`Selamat datang kembali, Admin ${data.name}!`);
      } catch (err) {
        console.error("Kesalahan Sistem:", err);
        alert('Terjadi kesalahan yang tak terduga.');
      }
    }

    // Logout
    function handleLogout() {
      localStorage.removeItem('blueshop_logged_user');
      currentUser = null;
      updateAuthUI();
      renderProducts(allProducts);
      alert('Berhasil logout.');
    }

    // Update Tampilan Tombol Berdasarkan Sesi Login
    function updateAuthUI() {
      const authBtn = document.getElementById('authBtn');
      const userStatus = document.getElementById('userStatus');
      const btnAddProduct = document.getElementById('btnAddProduct');

      if (currentUser && currentUser.role && currentUser.role.toLowerCase() === 'admin') {
        authBtn.innerText = 'Logout';
        authBtn.style.background = '#ef4444';
        authBtn.setAttribute('onclick', 'handleLogout()');
        userStatus.innerText = `👤 ${currentUser.name} (Admin)`;
        btnAddProduct.style.display = 'block';
      } else {
        authBtn.innerText = 'Login Admin';
        authBtn.style.background = '#10b981';
        authBtn.setAttribute('onclick', 'openLoginModal()');
        userStatus.innerText = '';
        btnAddProduct.style.display = 'none';
      }
    }

    // Ambil Data Produk
    async function fetchProducts() {
      const { data, error } = await _supabase.from('products').select('*');
      if (error) {
        document.getElementById('productGrid').innerHTML = '<p style="grid-column: 1/-1; color:red; text-align:center;">Gagal memuat produk database.</p>';
        return;
      }
      allProducts = data || [];
      renderProducts(allProducts);
    }

    // Render Grid Produk
    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">Tidak ada produk.</p>';
        return;
      }

      const isAdmin = currentUser && currentUser.role && currentUser.role.toLowerCase() === 'admin';

      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.image}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300'">
          <div class="product-details">
            <div>
              <div class="product-name">${p.name}</div>
              <div class="product-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
            </div>
            <button class="btn-buy">Beli Sekarang</button>
            ${isAdmin ? `
              <div class="admin-actions">
                <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                <button class="btn-delete" onclick="deleteProduct(${p.id})">Hapus</button>
              </div>
            ` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Kontrol Modal Login & Produk
    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function openProductModal(isEdit = false) {
      document.getElementById('productModal').style.display = 'flex';
      document.getElementById('productModalTitle').innerText = isEdit ? 'Edit Produk' : 'Tambah Produk Baru';
      if (!isEdit) {
        document.getElementById('productId').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productImage').value = '';
      }
    }
    function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

    // Tambah / Update Produk ke Supabase
    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('productId').value;
      const name = document.getElementById('productName').value;
      const price = Number(document.getElementById('productPrice').value);
      const image = document.getElementById('productImage').value;

      if (id) {
        await _supabase.from('products').update({ name, price, image }).eq('id', id);
      } else {
        await _supabase.from('products').insert([{ name, price, image }]);
      }

      closeProductModal();
      fetchProducts();
    }

    function editProduct(id) {
      const p = allProducts.find(item => item.id === id);
      if (p) {
        document.getElementById('productId').value = p.id;
        document.getElementById('productName').value = p.name;
        document.getElementById('productPrice').value = p.price;
        document.getElementById('productImage').value = p.image;
        openProductModal(true);
      }
    }

    async function deleteProduct(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        await _supabase.from('products').delete().eq('id', id);
        fetchProducts();
      }
    }

    function filterProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(keyword));
      renderProducts(filtered);
    }
  </script>
</body>
</html>
