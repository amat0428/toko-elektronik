<script>
    /* =========================================
       SUPABASE
    ========================================= */
    const SUPABASE_URL = 'https://fbnknnrltrsvydyxgujr.supabase.co';

    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibmtubnJsdHJzdnlkeXhndWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0MjYsImV4cCI6MjEwMzgxNjQyNn0.A46kddQQFKt8C-Kvq8Gt753acdEctsh7XibfMWKKP9o';

    const _supabase = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const TABLE_NAME = 'users_list';

    let allProducts = [];
    let cart = JSON.parse(
        localStorage.getItem('blueshop_cart')
    ) || [];

    let orders = JSON.parse(
        localStorage.getItem('blueshop_orders')
    ) || [];

    let currentUser = null;
    let isAdmin = false;


    /* =========================================
       SAAT HALAMAN TOKO DIBUKA
    ========================================= */
    document.addEventListener('DOMContentLoaded', async () => {

        const loggedIn = checkUserRole();

        // Kalau belum login, berhenti di sini
        if (!loggedIn) {
            return;
        }

        // Kalau sudah login, tetap di toko
        await fetchProducts();

        updateBadges();

        const searchInput =
            document.getElementById('searchInput');

        if (searchInput) {
            searchInput.addEventListener(
                'input',
                filterProducts
            );
        }
    });


    /* =========================================
       CEK LOGIN USER
    ========================================= */
    function checkUserRole() {

        const userData =
            localStorage.getItem('user') ||
            localStorage.getItem('currentUser');

        // BELUM LOGIN
        if (!userData) {

            alert('Silakan login terlebih dahulu.');

            window.location.replace('login.html');

            return false;
        }

        try {

            currentUser = JSON.parse(userData);

        } catch (e) {

            console.error(
                'Data user rusak:',
                e
            );

            localStorage.removeItem('user');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('isLoggedIn');

            window.location.replace('login.html');

            return false;
        }


        /* =====================================
           CEK DATA USER
        ===================================== */

        if (!currentUser) {

            window.location.replace('login.html');

            return false;
        }


        /* =====================================
           CEK ADMIN
        ===================================== */

        isAdmin =
            String(currentUser.role || '')
                .toLowerCase() === 'admin'
            ||
            String(currentUser.username || '')
                .toLowerCase() === 'admin';


        /* =====================================
           TAMPILKAN NAMA / ROLE
        ===================================== */

        const badge =
            document.getElementById('roleBadge');

        const btnAddNav =
            document.getElementById(
                'btnAddProductNav'
            );

        const title =
            document.getElementById(
                'sectionTitle'
            );

        const displayName =
            currentUser.name ||
            currentUser.username ||
            'User';


        if (isAdmin) {

            if (badge) {
                badge.innerText =
                    `🛡️ Admin: ${displayName}`;

                badge.style.background =
                    '#10b981';
            }

            if (btnAddNav) {
                btnAddNav.style.display =
                    'block';
            }

            if (title) {
                title.innerText =
                    'DAFTAR PRODUK (KONTROL ADMIN)';
            }

        } else {

            if (badge) {
                badge.innerText =
                    `👤 User: ${displayName}`;

                badge.style.background =
                    '#0284c7';
            }

            if (btnAddNav) {
                btnAddNav.style.display =
                    'none';
            }

            if (title) {
                title.innerText =
                    'DAFTAR PRODUK';
            }
        }


        return true;
    }


    /* =========================================
       LOGOUT
    ========================================= */
    function logout() {

        localStorage.removeItem('user');
        localStorage.removeItem('currentUser');
        localStorage.removeItem('isLoggedIn');

        window.location.replace('login.html');
    }


    /* =========================================
       AMBIL PRODUK
    ========================================= */
    async function fetchProducts() {

        const {
            data,
            error
        } = await _supabase
            .from('produk')
            .select('*')
            .order(
                'id_produk',
                {
                    ascending: false
                }
            );

        if (error) {

            console.error(
                'Gagal mengambil produk:',
                error
            );

            const grid =
                document.getElementById(
                    'productGrid'
                );

            if (grid) {
                grid.innerHTML = `
                    <p style="
                        grid-column:1/-1;
                        color:red;
                        text-align:center;
                    ">
                        Gagal memuat produk dari database.
                    </p>
                `;
            }

            return;
        }

        allProducts = data || [];

        renderProducts(allProducts);
    }


    /* =========================================
       TAMPILKAN PRODUK
    ========================================= */
    function renderProducts(products) {

        const grid =
            document.getElementById(
                'productGrid'
            );

        if (!grid) return;

        grid.innerHTML = '';

        if (
            !products ||
            products.length === 0
        ) {

            grid.innerHTML = `
                <p style="
                    grid-column:1/-1;
                    text-align:center;
                    color:#888;
                ">
                    Produk tidak ditemukan.
                </p>
            `;

            return;
        }


        products.forEach(p => {

            const id =
                p.id_produk || p.id;

            const name =
                p.nama_produk ||
                p.name ||
                'Produk Tanpa Nama';

            const price =
                p.harga ||
                p.price ||
                0;

            const image =
                p.gambar ||
                p.image ||
                '';


            const adminButtonsHTML =
                isAdmin
                    ? `
                        <div class="admin-actions">

                            <button
                                class="btn-edit"
                                onclick="editProduct(${id})"
                            >
                                Edit
                            </button>

                            <button
                                class="btn-delete"
                                onclick="deleteProduct(${id})"
                            >
                                Hapus
                            </button>

                        </div>
                    `
                    : '';


            const card =
                document.createElement('div');

            card.className =
                'product-card';


            card.innerHTML = `

                <img
                    src="${image}"
                    class="product-img"
                    alt="${name}"
                    onerror="
                        this.onerror=null;
                        this.src='https://placehold.co/300x200?text=Produk';
                    "
                >

                <div class="product-details">

                    <div>

                        <div class="product-name">
                            ${name}
                        </div>

                        <div class="product-price">
                            Rp ${Number(price).toLocaleString('id-ID')}
                        </div>

                    </div>


                    <div>

                        <button
                            class="btn-buy"
                            onclick="buyNow(${id})"
                        >
                            Beli Langsung
                        </button>

                        <button
                            class="btn-add-cart"
                            onclick="addToCart(${id})"
                        >
                            + 🛒 Keranjang
                        </button>

                    </div>

                    ${adminButtonsHTML}

                </div>
            `;

            grid.appendChild(card);
        });
    }


    /* =========================================
       PENCARIAN
    ========================================= */
    function filterProducts() {

        const searchInput =
            document.getElementById(
                'searchInput'
            );

        if (!searchInput) return;

        const keyword =
            searchInput.value
                .toLowerCase()
                .trim();


        const filtered =
            allProducts.filter(p => {

                const name =
                    (
                        p.nama_produk ||
                        p.name ||
                        ''
                    )
                    .toLowerCase();

                return name.includes(
                    keyword
                );
            });


        renderProducts(filtered);
    }


    /* =========================================
       KERANJANG
    ========================================= */
    function addToCart(productId) {

        const product =
            allProducts.find(
                p =>
                    (p.id_produk || p.id)
                    == productId
            );

        if (!product) return;


        const id =
            product.id_produk ||
            product.id;

        const name =
            product.nama_produk ||
            product.name;

        const price =
            Number(
                product.harga ||
                product.price ||
                0
            );

        const image =
            product.gambar ||
            product.image ||
            '';


        const existingItem =
            cart.find(
                item =>
                    item.id == id
            );


        if (existingItem) {

            existingItem.qty += 1;

        } else {

            cart.push({
                id,
                name,
                price,
                image,
                qty: 1
            });
        }


        saveCart();

        alert(
            `${name} telah ditambahkan ke keranjang!`
        );
    }


    function buyNow(productId) {

        addToCart(productId);

        openCartModal();
    }


    function updateCartQty(
        productId,
        change
    ) {

        const item =
            cart.find(
                i =>
                    i.id == productId
            );

        if (!item) return;


        item.qty += change;


        if (item.qty <= 0) {

            cart =
                cart.filter(
                    i =>
                        i.id != productId
                );
        }


        saveCart();

        renderCartItems();
    }


    function saveCart() {

        localStorage.setItem(
            'blueshop_cart',
            JSON.stringify(cart)
        );

        updateBadges();
    }


    function updateBadges() {

        const cartBadge =
            document.getElementById(
                'cartBadge'
            );

        const orderBadge =
            document.getElementById(
                'orderBadge'
            );


        if (cartBadge) {

            cartBadge.innerText =
                cart.reduce(
                    (sum, item) =>
                        sum + item.qty,
                    0
                );
        }


        if (orderBadge) {

            orderBadge.innerText =
                orders.length;
        }
    }


    /* =========================================
       MODAL KERANJANG
    ========================================= */
    function openCartModal() {

        renderCartItems();

        const modal =
            document.getElementById(
                'cartModal'
            );

        if (modal) {
            modal.style.display =
                'flex';
        }
    }


    function closeCartModal() {

        const modal =
            document.getElementById(
                'cartModal'
            );

        if (modal) {
            modal.style.display =
                'none';
        }
    }


    function renderCartItems() {

        const container =
            document.getElementById(
                'cartItemsContainer'
            );

        const btnCheckout =
            document.getElementById(
                'btnCheckout'
            );

        if (!container) return;

        container.innerHTML = '';


        if (cart.length === 0) {

            container.innerHTML = `
                <p style="
                    text-align:center;
                    color:#888;
                ">
                    Keranjang belanja kamu masih kosong.
                </p>
            `;

            const total =
                document.getElementById(
                    'cartTotalPrice'
                );

            if (total) {
                total.innerText =
                    'Rp 0';
            }

            if (btnCheckout) {
                btnCheckout.style.display =
                    'none';
            }

            return;
        }


        if (btnCheckout) {
            btnCheckout.style.display =
                'block';
        }


        let totalPrice = 0;


        cart.forEach(item => {

            totalPrice +=
                item.price *
                item.qty;


            const div =
                document.createElement('div');

            div.className =
                'cart-item';


            div.innerHTML = `

                <div class="cart-info">

                    <div class="cart-title">
                        ${item.name}
                    </div>

                    <div class="cart-price">
                        Rp ${Number(item.price).toLocaleString('id-ID')}
                    </div>

                </div>


                <div class="cart-controls">

                    <button
                        onclick="updateCartQty(${item.id}, -1)"
                    >
                        -
                    </button>

                    <span style="
                        font-size:13px;
                        font-weight:bold;
                    ">
                        ${item.qty}
                    </span>

                    <button
                        onclick="updateCartQty(${item.id}, 1)"
                    >
                        +
                    </button>

                </div>
            `;


            container.appendChild(div);
        });


        const total =
            document.getElementById(
                'cartTotalPrice'
            );

        if (total) {

            total.innerText =
                `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }
    }


    /* =========================================
       CHECKOUT
    ========================================= */
    function checkout() {

        if (cart.length === 0) return;


        const newOrder = {

            id:
                'ORD-' +
                Date.now()
                    .toString()
                    .slice(-6),

            date:
                new Date()
                    .toLocaleDateString('id-ID'),

            items:
                [...cart],

            total:
                cart.reduce(
                    (sum, i) =>
                        sum +
                        (i.price * i.qty),
                    0
                ),

            status:
                'Diproses'
        };


        orders.unshift(newOrder);


        localStorage.setItem(
            'blueshop_orders',
            JSON.stringify(orders)
        );


        cart = [];

        saveCart();

        closeCartModal();

        openOrdersModal();


        alert(
            `Pesanan #${newOrder.id} berhasil dibuat!`
        );
    }


    /* =========================================
       PESANAN
    ========================================= */
    function openOrdersModal() {

        renderOrdersList();

        const modal =
            document.getElementById(
                'ordersModal'
            );

        if (modal) {
            modal.style.display =
                'flex';
        }
    }


    function closeOrdersModal() {

        const modal =
            document.getElementById(
                'ordersModal'
            );

        if (modal) {
            modal.style.display =
                'none';
        }
    }


    function renderOrdersList() {

        const container =
            document.getElementById(
                'ordersContainer'
            );

        if (!container) return;

        container.innerHTML = '';


        if (orders.length === 0) {

            container.innerHTML = `
                <p style="
                    text-align:center;
                    color:#888;
                ">
                    Belum ada pesanan.
                </p>
            `;

            return;
        }


        orders.forEach(order => {

            const itemNames =
                order.items
                    .map(
                        i =>
                            `${i.name} (${i.qty}x)`
                    )
                    .join(', ');


            const div =
                document.createElement('div');

            div.className =
                'order-card';

            div.style.flexDirection =
                'column';

            div.style.alignItems =
                'flex-start';


            div.innerHTML = `

                <div style="
                    display:flex;
                    justify-content:space-between;
                    width:100%;
                ">

                    <strong style="
                        font-size:13px;
                        color:#2563eb;
                    ">
                        Pesanan #${order.id}
                    </strong>

                    <span style="
                        font-size:11px;
                        color:#666;
                    ">
                        ${order.date}
                    </span>

                </div>


                <div style="
                    font-size:12px;
                    margin:4px 0;
                ">

                    <b>Produk:</b>
                    ${itemNames}

                </div>


                <div style="
                    display:flex;
                    justify-content:space-between;
                    width:100%;
                    align-items:center;
                ">

                    <span style="
                        color:#dc2626;
                        font-weight:bold;
                        font-size:13px;
                    ">
                        Total:
                        Rp ${Number(order.total).toLocaleString('id-ID')}
                    </span>

                    <span class="order-status">
                        ${order.status}
                    </span>

                </div>
            `;


            container.appendChild(div);
        });
    }


    /* =========================================
       MODAL PRODUK ADMIN
    ========================================= */
    function openProductModal(
        isEdit = false
    ) {

        if (!isAdmin) return;


        const modal =
            document.getElementById(
                'productModal'
            );

        if (modal) {
            modal.style.display =
                'flex';
        }


        const title =
            document.getElementById(
                'productModalTitle'
            );

        if (title) {

            title.innerText =
                isEdit
                    ? 'Edit Produk'
                    : 'Tambah Produk Baru';
        }


        if (!isEdit) {

            document.getElementById(
                'productId'
            ).value = '';

            document.getElementById(
                'productName'
            ).value = '';

            document.getElementById(
                'productPrice'
            ).value = '';

            document.getElementById(
                'productImage'
            ).value = '';
        }
    }


    function closeProductModal() {

        const modal =
            document.getElementById(
                'productModal'
            );

        if (modal) {
            modal.style.display =
                'none';
        }
    }


    /* =========================================
       SIMPAN PRODUK
    ========================================= */
    async function saveProduct() {

        if (!isAdmin) {

            alert(
                'Hanya admin yang dapat mengelola produk.'
            );

            return;
        }


        const id =
            document.getElementById(
                'productId'
            ).value;


        const nama_produk =
            document.getElementById(
                'productName'
            ).value
            .trim();


        const harga =
            Number(
                document.getElementById(
                    'productPrice'
                ).value
            );


        const gambar =
            document.getElementById(
                'productImage'
            ).value
            .trim();


        if (!nama_produk || !harga) {

            alert(
                'Nama dan harga produk wajib diisi.'
            );

            return;
        }


        let result;


        if (id) {

            result =
                await _supabase
                    .from('produk')
                    .update({
                        nama_produk,
                        harga,
                        gambar
                    })
                    .eq(
                        'id_produk',
                        id
                    );

        } else {

            result =
                await _supabase
                    .from('produk')
                    .insert([
                        {
                            nama_produk,
                            harga,
                            gambar,
                            stok: 100
                        }
                    ]);
        }


        if (result.error) {

            console.error(
                result.error
            );

            alert(
                'Gagal menyimpan produk: ' +
                result.error.message
            );

            return;
        }


        alert(
            'Produk berhasil disimpan.'
        );

        closeProductModal();

        fetchProducts();
    }


    /* =========================================
       EDIT PRODUK
    ========================================= */
    function editProduct(id) {

        if (!isAdmin) return;


        const p =
            allProducts.find(
                item =>
                    (item.id_produk ||
                        item.id) == id
            );


        if (!p) return;


        document.getElementById(
            'productId'
        ).value =
            p.id_produk || p.id;


        document.getElementById(
            'productName'
        ).value =
            p.nama_produk || p.name || '';


        document.getElementById(
            'productPrice'
        ).value =
            p.harga || p.price || '';


        document.getElementById(
            'productImage'
        ).value =
            p.gambar || p.image || '';


        openProductModal(true);
    }


    /* =========================================
       HAPUS PRODUK
    ========================================= */
    async function deleteProduct(id) {

        if (!isAdmin) return;


        if (
            !confirm(
                'Yakin ingin menghapus produk ini?'
            )
        ) {
            return;
        }


        const {
            error
        } = await _supabase
            .from('produk')
            .delete()
            .eq(
                'id_produk',
                id
            );


        if (error) {

            alert(
                'Gagal menghapus produk: ' +
                error.message
            );

            return;
        }


        alert(
            'Produk berhasil dihapus.'
        );

        fetchProducts();
    }
</script>
