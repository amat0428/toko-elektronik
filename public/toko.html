<script>
const SUPABASE_URL = "https://fbnknnrltrsvydyxgujr.supabase.co";
const SUPABASE_KEY = "sb_publishable_JStXk700ejTvHYnjAHlCYA_1tf1Kccp";

let _supabase = null;

// Cek apakah SDK Supabase sudah terload dari CDN
if (typeof supabase !== "undefined") {
    _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} else {
    console.error("SDK Supabase belum terload di HTML! Pastikan CDN Supabase sudah terpasang.");
}

let allProducts = [];
let cart = JSON.parse(localStorage.getItem("blueshop_cart") || "[]");
let orders = JSON.parse(localStorage.getItem("blueshop_orders") || "[]");
let currentUser = null;
let isAdmin = false;

// =====================================================
// SAAT HALAMAN DIBUKA
// =====================================================
document.addEventListener("DOMContentLoaded", async function () {
    console.log("BlueShop mulai...");

    const loggedIn = checkUserRole();
    if (!loggedIn) return;

    await fetchProducts();
    updateBadges();

    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("input", filterProducts);
    }
});

// =====================================================
// CEK LOGIN
// =====================================================
function checkUserRole() {
    const userData = localStorage.getItem("user") || 
                     localStorage.getItem("currentUser") || 
                     localStorage.getItem("user_session");

    if (!userData) {
        alert("Silakan login terlebih dahulu.");
        window.location.replace("login.html");
        return false;
    }

    try {
        currentUser = JSON.parse(userData);
    } catch (error) {
        console.error("Data login rusak:", error);
        clearAuthData();
        window.location.replace("login.html");
        return false;
    }

    if (!currentUser) {
        window.location.replace("login.html");
        return false;
    }

    const role = String(currentUser.role || "").toLowerCase();
    const username = String(currentUser.username || "").toLowerCase();

    isAdmin = (role === "admin" || username === "admin");

    const badge = document.getElementById("roleBadge");
    const btnAddNav = document.getElementById("btnAddProductNav");
    const title = document.getElementById("sectionTitle");
    const displayName = currentUser.name || currentUser.username || "User";

    if (isAdmin) {
        if (badge) {
            badge.innerText = "🛡️ Admin: " + displayName;
            badge.style.background = "#10b981";
        }
        if (btnAddNav) btnAddNav.style.display = "block";
        if (title) title.innerText = "DAFTAR PRODUK (KONTROL ADMIN)";
    } else {
        if (badge) {
            badge.innerText = "👤 User: " + displayName;
            badge.style.background = "#0284c7";
        }
        if (btnAddNav) btnAddNav.style.display = "none";
        if (title) title.innerText = "DAFTAR PRODUK";
    }

    return true;
}

function clearAuthData() {
    localStorage.removeItem("user");
    localStorage.removeItem("currentUser");
    localStorage.removeItem("user_session");
    localStorage.removeItem("isLoggedIn");
}

function logout() {
    clearAuthData();
    window.location.href = "login.html";
}

// =====================================================
// AMBIL PRODUK DARI SUPABASE
// =====================================================
async function fetchProducts() {
    const grid = document.getElementById("productGrid");
    if (!grid) return;

    grid.innerHTML = `<p style="grid-column:1/-1; text-align:center;">Memuat produk...</p>`;

    if (!_supabase) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:red;">Koneksi Supabase gagal diinisialisasi.</p>`;
        return;
    }

    try {
        const { data, error } = await _supabase
            .from("produk")
            .select("*")
            .order("id_produk", { ascending: false });

        if (error) {
            console.error("SUPABASE ERROR:", error);
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:30px; color:#dc2626;">
                    <h3>Gagal memuat produk</h3>
                    <p>${escapeHTML(error.message)}</p>
                </div>
            `;
            return;
        }

        allProducts = data || [];
        renderProducts(allProducts);
    } catch (error) {
        console.error("ERROR FETCH:", error);
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:red;">Terjadi kesalahan saat mengambil data produk.</p>`;
    }
}

// =====================================================
// TAMPILKAN PRODUK
// =====================================================
function renderProducts(products) {
    const grid = document.getElementById("productGrid");
    if (!grid) return;

    grid.innerHTML = "";

    if (!products || products.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#888;">Produk tidak ditemukan.</p>`;
        return;
    }

    products.forEach(function (p) {
        const id = p.id_produk ?? p.id;
        const name = p.nama_produk || p.name || "Produk Tanpa Nama";
        const price = Number(p.harga || p.price || 0);
        const image = p.gambar || p.image || "https://placehold.co/300x200?text=No+Image";

        let adminButtonsHTML = "";
        if (isAdmin) {
            adminButtonsHTML = `
                <div class="admin-actions">
                    <button class="btn-edit" onclick="editProduct(${id})">✏️ Edit</button>
                    <button class="btn-delete" onclick="deleteProduct(${id})">🗑️ Hapus</button>
                </div>
            `;
        }

        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
            <img src="${escapeAttribute(image)}" class="product-img" alt="${escapeAttribute(name)}" onerror="this.src='https://placehold.co/300x200?text=No+Image'">
            <div class="product-details">
                <div>
                    <div class="product-name">${escapeHTML(name)}</div>
                    <div class="product-price">Rp ${price.toLocaleString("id-ID")}</div>
                </div>
                <div>
                    <button class="btn-buy" onclick="buyNow(${id})">Beli Langsung</button>
                    <button class="btn-add-cart" onclick="addToCart(${id})">+ 🛒 Keranjang</button>
                </div>
                ${adminButtonsHTML}
            </div>
        `;
        grid.appendChild(card);
    });
}

// =====================================================
// ESCAPE HTML & ATTRIBUTE
// =====================================================
function escapeHTML(text) {
    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(text) {
    return escapeHTML(text);
}

// =====================================================
// SEARCH
// =====================================================
function filterProducts() {
    const searchInput = document.getElementById("searchInput");
    if (!searchInput) return;

    const keyword = searchInput.value.toLowerCase().trim();
    const filtered = allProducts.filter(function (p) {
        const name = String(p.nama_produk || p.name || "").toLowerCase();
        return name.includes(keyword);
    });

    renderProducts(filtered);
}

// =====================================================
// KERANJANG & CHECKOUT
// =====================================================
function addToCart(productId) {
    const product = allProducts.find(p => (p.id_produk ?? p.id) == productId);
    if (!product) {
        alert("Produk tidak ditemukan.");
        return;
    }

    const id = product.id_produk ?? product.id;
    const name = product.nama_produk || product.name || "Produk";
    const price = Number(product.harga || product.price || 0);
    const image = product.gambar || product.image || "";

    const existingItem = cart.find(item => item.id == id);
    if (existingItem) {
        existingItem.qty += 1;
    } else {
        cart.push({ id, name, price, image, qty: 1 });
    }

    saveCart();
    alert(name + " berhasil ditambahkan ke keranjang!");
}

function buyNow(productId) {
    addToCart(productId);
    openCartModal();
}

function updateCartQty(productId, change) {
    const item = cart.find(i => i.id == productId);
    if (!item) return;

    item.qty += change;
    if (item.qty <= 0) {
        cart = cart.filter(i => i.id != productId);
    }

    saveCart();
    renderCartItems();
}

function saveCart() {
    localStorage.setItem("blueshop_cart", JSON.stringify(cart));
    updateBadges();
}

function updateBadges() {
    const cartBadge = document.getElementById("cartBadge");
    const orderBadge = document.getElementById("orderBadge");

    const totalQty = cart.reduce((sum, item) => sum + Number(item.qty || 0), 0);

    if (cartBadge) cartBadge.innerText = totalQty;
    if (orderBadge) orderBadge.innerText = orders.length;
}

function openCartModal() {
    const modal = document.getElementById("cartModal");
    if (!modal) return;
    renderCartItems();
    modal.style.display = "flex";
}

function closeCartModal() {
    const modal = document.getElementById("cartModal");
    if (modal) modal.style.display = "none";
}

function renderCartItems() {
    const container = document.getElementById("cartItemsContainer");
    const btnCheckout = document.getElementById("btnCheckout");
    const totalElement = document.getElementById("cartTotalPrice");

    if (!container) return;
    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888;">Keranjang belanja kamu masih kosong.</p>`;
        if (totalElement) totalElement.innerText = "Rp 0";
        if (btnCheckout) btnCheckout.style.display = "none";
        return;
    }

    if (btnCheckout) btnCheckout.style.display = "block";

    let totalPrice = 0;
    cart.forEach(function (item) {
        totalPrice += Number(item.price) * Number(item.qty);

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
            <div class="cart-info">
                <div class="cart-title">${escapeHTML(item.name)}</div>
                <div class="cart-price">Rp ${Number(item.price).toLocaleString("id-ID")}</div>
            </div>
            <div class="cart-controls">
                <button onclick="updateCartQty(${item.id}, -1)">-</button>
                <span>${item.qty}</span>
                <button onclick="updateCartQty(${item.id}, 1)">+</button>
            </div>
        `;
        container.appendChild(div);
    });

    if (totalElement) {
        totalElement.innerText = "Rp " + totalPrice.toLocaleString("id-ID");
    }
}

function checkout() {
    if (cart.length === 0) {
        alert("Keranjang masih kosong.");
        return;
    }

    const newOrder = {
        id: "ORD-" + Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString("id-ID"),
        items: [...cart],
        total: cart.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0),
        status: "Diproses"
    };

    orders.unshift(newOrder);
    localStorage.setItem("blueshop_orders", JSON.stringify(orders));
    cart = [];
    saveCart();
    closeCartModal();
    openOrdersModal();
    alert("Pesanan #" + newOrder.id + " berhasil dibuat!");
}

// =====================================================
// ORDER MODAL & LIST
// =====================================================
function openOrdersModal() {
    const modal = document.getElementById("ordersModal");
    if (!modal) return;
    renderOrdersList();
    modal.style.display = "flex";
}

function closeOrdersModal() {
    const modal = document.getElementById("ordersModal");
    if (modal) modal.style.display = "none";
}

function renderOrdersList() {
    const container = document.getElementById("ordersContainer");
    if (!container) return;

    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888;">Belum ada pesanan.</p>`;
        return;
    }

    orders.forEach(function (order) {
        const itemNames = (order.items || [])
            .map(i => escapeHTML(i.name) + " (" + i.qty + "x)")
            .join(", ");

        const div = document.createElement("div");
        div.className = "order-card";
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; width:100%;">
                <strong style="font-size:13px; color:#2563eb;">Pesanan #${escapeHTML(order.id)}</strong>
                <span style="font-size:11px; color:#666;">${escapeHTML(order.date)}</span>
            </div>
            <div style="font-size:12px; margin:4px 0;">
                <b>Produk:</b> ${itemNames}
            </div>
            <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                <span style="color:#dc2626; font-weight:bold; font-size:13px;">
                    Total: Rp ${Number(order.total).toLocaleString("id-ID")}
                </span>
                <span class="order-status">${escapeHTML(order.status)}</span>
            </div>
        `;
        container.appendChild(div);
    });
}

// =====================================================
// MANAJEMEN PRODUK (ADMIN)
// =====================================================
function openProductModal(isEdit = false) {
    if (!isAdmin) {
        alert("Hanya admin yang dapat mengelola produk.");
        return;
    }

    const modal = document.getElementById("productModal");
    if (!modal) {
        alert("Modal produk tidak ditemukan di HTML.");
        return;
    }

    const title = document.getElementById("productModalTitle");
    if (title) {
        title.innerText = isEdit ? "Edit Produk" : "Tambah Produk Baru";
    }

    if (!isEdit) {
        document.getElementById("productId").value = "";
        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productImage").value = "";
    }

    modal.style.display = "flex";
}

function closeProductModal() {
    const modal = document.getElementById("productModal");
    if (modal) modal.style.display = "none";
}

async function saveProduct() {
    if (!isAdmin) {
        alert("Hanya admin yang dapat mengelola produk.");
        return;
    }

    const id = document.getElementById("productId").value;
    const nama_produk = document.getElementById("productName").value.trim();
    const harga = Number(document.getElementById("productPrice").value);
    const gambar = document.getElementById("productImage").value.trim();

    if (!nama_produk) {
        alert("Nama produk wajib diisi.");
        return;
    }

    if (Number.isNaN(harga) || harga < 0) {
        alert("Harga produk tidak valid.");
        return;
    }

    try {
        let result;

        if (id) {
            // EDIT PRODUK
            result = await _supabase
                .from("produk")
                .update({ nama_produk, harga, gambar })
                .eq("id_produk", id);
        } else {
            // TAMBAH PRODUK (Menggunakan array object untuk insert Supabase)
            result = await _supabase
                .from("produk")
                .insert([{ nama_produk, harga, gambar, stok: 100 }]);
        }

        if (result.error) throw result.error;

        alert(id ? "Produk berhasil diperbarui!" : "Produk berhasil ditambahkan!");
        closeProductModal();
        await fetchProducts();

    } catch (error) {
        console.error("SAVE PRODUCT ERROR:", error);
        alert("Gagal menyimpan produk:\n" + error.message);
    }
}

function editProduct(id) {
    if (!isAdmin) return;

    const product = allProducts.find(item => (item.id_produk ?? item.id) == id);
    if (!product) {
        alert("Produk tidak ditemukan.");
        return;
    }

    document.getElementById("productId").value = product.id_produk ?? product.id;
    document.getElementById("productName").value = product.nama_produk || product.name || "";
    document.getElementById("productPrice").value = product.harga || product.price || 0;
    document.getElementById("productImage").value = product.gambar || product.image || "";

    openProductModal(true);
}

async function deleteProduct(id) {
    if (!isAdmin) {
        alert("Hanya admin yang dapat menghapus produk.");
        return;
    }

    if (!confirm("Yakin ingin menghapus produk ini?")) return;

    try {
        const result = await _supabase
            .from("produk")
            .delete()
            .eq("id_produk", id);

        if (result.error) throw result.error;

        alert("Produk berhasil dihapus!");
        await fetchProducts();

    } catch (error) {
        console.error("DELETE PRODUCT ERROR:", error);
        alert("Gagal menghapus produk:\n" + error.message);
    }
}
</script>
