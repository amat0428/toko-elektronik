<script>
    const SUPABASE_URL = 'https://fbnknnrltrsvydyxgujr.supabase.co';

    const SUPABASE_KEY = 'PASTE_SUPABASE_ANON_KEY_KAMU_DI_SINI';

    const _supabase = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    let allProducts = [];

    let cart = JSON.parse(
        localStorage.getItem('blueshop_cart')
    ) || [];

    let orders = JSON.parse(
        localStorage.getItem('blueshop_orders')
    ) || [];

    let currentUser = null;
    let isAdmin = false;


    /* =========================================
       SAAT TOKO DIBUKA
    ========================================= */

    document.addEventListener('DOMContentLoaded', async () => {

        // CEK LOGIN TERLEBIH DAHULU
        const loggedIn = checkUserRole();

        // Kalau belum login, berhenti di sini
        if (!loggedIn) {
            return;
        }

        // Kalau sudah login, lanjutkan toko
        await fetchProducts();

        updateBadges();


        // SEARCH
        const searchInput =
            document.getElementById('searchInput');

        if (searchInput) {
            searchInput.addEventListener(
                'input',
                filterProducts
            );
        }
    });


    /* =========================================
       CEK USER / LOGIN
    ========================================= */

    function checkUserRole() {

        const userData =
            localStorage.getItem('user') ||
            localStorage.getItem('currentUser');


        // BELUM LOGIN
        if (!userData) {

            alert('Silakan login terlebih dahulu.');

            window.location.href = 'login.html';

            return false;
        }


        // BACA DATA USER
        try {

            currentUser = JSON.parse(userData);

        } catch (error) {

            localStorage.removeItem('user');
            localStorage.removeItem('currentUser');

            alert('Data login tidak valid. Silakan login kembali.');

            window.location.href = 'login.html';

            return false;
        }


        // CEK ADMIN
        const role =
            String(currentUser.role || '').toLowerCase();

        const username =
            String(currentUser.username || '').toLowerCase();


        isAdmin =
            role === 'admin' ||
            username === 'admin';


        // BADGE ROLE
        const badge =
            document.getElementById('roleBadge');

        const btnAddNav =
            document.getElementById('btnAddProductNav');

        const title =
            document.getElementById('sectionTitle');


        const displayName =
            currentUser.name ||
            currentUser.username ||
            'User';


        if (isAdmin) {

            if (badge) {

                badge.innerText =
                    `🛡️ Admin: ${displayName}`;

                badge.style.background =
                    '#10b981';
            }

            if (btnAddNav) {
                btnAddNav.style.display = 'block';
            }

            if (title) {
                title.innerText =
                    'DAFTAR PRODUK (KONTROL ADMIN)';
            }

        } else {

            if (badge) {

                badge.innerText =
                    `👤 User: ${displayName}`;

                badge.style.background =
                    '#0284c7';
            }

            if (btnAddNav) {
                btnAddNav.style.display = 'none';
            }

            if (title) {
                title.innerText =
                    'DAFTAR PRODUK';
            }
        }


        // LOGIN VALID
        return true;
    }


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

        localStorage.removeItem('user');
        localStorage.removeItem('currentUser');
        localStorage.removeItem('isLoggedIn');

        window.location.href = 'login.html';
    }
