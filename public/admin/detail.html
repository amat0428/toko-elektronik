<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detail Produk - Toko Elektronik</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

            <h1 class="text-xl font-bold">
                Toko Elektronik
            </h1>

            <a
                href="javascript:history.back()"
                class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition"
            >
                ← Kembali ke Produk
            </a>

        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <div
            id="productDetail"
            class="bg-white rounded-xl shadow-md p-6 border border-gray-100"
        >

            <div class="text-center py-12 text-gray-400">

                <i
                    class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-blue-600"
                ></i>

                <p>
                    Memuat detail produk...
                </p>

            </div>

        </div>

    </main>

    <script src="js/products.js"></script>

</body>

</html>
