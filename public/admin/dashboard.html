<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Toko Elektronik</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .nav-links a { margin-right: 15px; text-decoration: none; color: #0070f3; font-weight: bold; }
    .stats-container { display: flex; gap: 20px; margin-top: 20px; }
    .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; text-align: center; }
    .stat-card h3 { margin: 0 0 10px 0; color: #555; }
    .stat-card p { font-size: 32px; font-weight: bold; margin: 0; color: #0070f3; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Dashboard Admin</h1>
    <div class="nav-links">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/orders.html">Kelola Pesanan</a>
      <a href="/admin/products.html">Kelola Produk</a>
      <a href="/" style="color: red;">Kembali ke Toko</a>
    </div>
  </div>

  <h2>Ringkasan Toko</h2>
  <div class="stats-container">
    <div class="stat-card">
      <h3>Total Pesanan</h3>
      <p id="totalOrders">0</p>
    </div>
    <div class="stat-card">
      <h3>Total Produk</h3>
      <p id="totalProducts">0</p>
    </div>
    <div class="stat-card">
      <h3>Status Akun</h3>
      <p style="font-size: 24px; color: green;" id="adminStatus">Admin Active</p>
    </div>
  </div>

  <script>
    // Ambil statistik ringkas dari backend API
    async function fetchStats() {
      try {
        const [resOrders, resProducts] = await Promise.all([
          fetch('/api/orders'),
          fetch('/api/products')
        ]);

        if (resOrders.ok) {
          const orders = await resOrders.json();
          document.getElementById('totalOrders').innerText = orders.length || 0;
        }

        if (resProducts.ok) {
          const products = await resProducts.json();
          document.getElementById('totalProducts').innerText = products.length || 0;
        }
      } catch (error) {
        console.error('Gagal mengambil statistik:', error);
      }
    }

    fetchStats();
  </script>
</body>
</html>
