<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin - Kelola Pesanan</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <h1>Daftar Pesanan Pelanggan</h1>
  
  <table border="1" cellPadding="8" id="ordersTable">
    <thead>
      <tr>
        <th>ID Pesanan</th>
        <th>Pemesan</th>
        <th>Jumlah Pesanan</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="ordersList">
      <!-- Data pesanan akan muncul di sini -->
    </tbody>
  </table>

  <script>
    // 1. Load data saat halaman dibuka
    async function loadOrders() {
      const res = await fetch('/api/orders');
      const orders = await res.json();
      
      const tbody = document.getElementById('ordersList');
      tbody.innerHTML = '';

      orders.forEach(order => {
        tbody.innerHTML += `
          <tr>
            <td>#${order.id}</td>
            <td>${order.email_pemesan || order.user_id}</td>
            <td><strong>${order.jumlah_pesanan}</strong></td>
            <td>
              <button onclick="updateQty('${order.id}', ${order.jumlah_pesanan - 1})">-</button>
              <button onclick="updateQty('${order.id}', ${order.jumlah_pesanan + 1})">+</button>
            </td>
          </tr>
        `;
      });
    }

    // 2. Fungsi Tambah / Kurang Pesanan
    async function updateQty(orderId, newQty) {
      if (newQty < 1) return alert('Jumlah minimal 1!');
      
      const res = await fetch('/api/orders', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, newQuantity: newQty })
      });

      if (res.ok) {
        loadOrders(); // Refresh tampilan tabel
      } else {
        alert('Gagal mengupdate jumlah pesanan');
      }
    }

    loadOrders();
  </script>
</body>
</html>
