<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - BlueShop</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #222;
        }

        .header small {
            color: #777;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a,
        .logout-btn {
            text-decoration: none;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-dashboard {
            background: #0d6efd;
            color: white;
        }

        .btn-store {
            background: #198754;
            color: white;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
        }

        .container-main {
            padding: 30px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .welcome h2 {
            margin-bottom: 8px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
            text-align: center;
        }

        .stat-icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
            color: #0d6efd;
        }

        .quick-menu {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .quick-menu h3 {
            margin-bottom: 20px;
        }

        .quick-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .quick-buttons a {
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 10px;
            background: #0d6efd;
            color: white;
            font-weight: bold;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #d1e7dd;
            color: #0f5132;
        }

        .loading {
            opacity: .6;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .container-main {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <div>
            <h1>
                <i class="fa-solid fa-gauge-high"></i>
                Dashboard Admin
            </h1>

            <small>
                BlueShop - Panel Administrasi
            </small>
        </div>

        <div class="nav-links">

            <a
                href="admin.html"
                class="btn-dashboard"
            >
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a
                href="toko.html"
                class="btn-store"
            >
                <i class="fa-solid fa-store"></i>
                Ke Toko
            </a>

            <button
                onclick="logout()"
                class="logout-btn btn-logout"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </div>


    <!-- CONTENT -->
    <div class="container-main">

        <!-- WELCOME -->
        <div class="welcome">

            <h2>
                Halo, <span id="adminName">Admin</span> 👋
            </h2>

            <p class="mb-0">
                Selamat datang di Dashboard Admin BlueShop.
            </p>

        </div>


        <!-- STATISTICS -->
        <div class="stats-container">

            <!-- PESANAN -->
            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                <h3>
                    Total Pesanan
                </h3>

                <p id="totalOrders">
                    0
                </p>

            </div>


            <!-- PRODUK -->
            <div class="stat-card">

                <div class="stat-icon">
                    🛍️
                </div>

                <h3>
                    Total Produk
                </h3>

                <p id="totalProducts">
                    0
                </p>

            </div>


            <!-- STATUS -->
            <div class="stat-card">

                <div class="stat-icon">
                    🛡️
                </div>

                <h3>
                    Status Akun
                </h3>

                <p
                    id="adminStatus"
                    style="font-size: 24px; color: green;"
                >
                    Admin Active
                </p>

            </div>

        </div>


        <!-- QUICK MENU -->
        <div class="quick-menu">

            <h3>
                <i class="fa-solid fa-bolt"></i>
                Menu Admin
            </h3>

            <div class="quick-buttons">

                <a href="admin.html">
                    <i class="fa-solid fa-gauge"></i>
                    Dashboard
                </a>

                <a href="orders.html">
                    <i class="fa-solid fa-box"></i>
                    Kelola Pesanan
                </a>

                <a href="products.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Kelola Produk
                </a>

                <a href="toko.html">
                    <i class="fa-solid fa-store"></i>
                    Lihat Toko
                </a>

            </div>

        </div>


        <!-- STATUS -->
        <div
            id="systemStatus"
            class="status"
        >
            <i class="fa-solid fa-circle-check"></i>
            Sistem sedang memuat data...
        </div>

    </div>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>


    <script>

        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const SUPABASE_URL =
            "https://fbnknnrltrsvydyxgujr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_JStXk700ejTvHYnjAHlCYA_1tf1Kccp";

        let supabaseClient = null;


        /* =====================================================
           INIT SUPABASE
        ===================================================== */

        function initializeSupabase() {

            if (!window.supabase) {

                console.error(
                    "Supabase JS gagal dimuat."
                );

                alert(
                    "Supabase gagal dimuat. Periksa koneksi internet."
                );

                return false;
            }

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

            console.log(
                "✅ Supabase admin berhasil terhubung."
            );

            return true;
        }


        /* =====================================================
           CEK LOGIN + ROLE ADMIN
        ===================================================== */

        async function checkAdmin() {

            try {

                const {
                    data: {
                        user
                    },
                    error
                } =
                    await supabaseClient.auth.getUser();


                /* BELUM LOGIN */

                if (
                    error ||
                    !user
                ) {

                    console.log(
                        "❌ Belum login."
                    );

                    window.location.href =
                        "login.html";

                    return false;
                }


                const email =
                    String(
                        user.email || ""
                    )
                    .trim()
                    .toLowerCase();


                console.log(
                    "🔎 Email login:",
                    email
                );


                /* AMBIL ROLE DARI DATABASE */

                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("users_list")
                        .select(
                            "id, name, username, role"
                        )
                        .eq(
                            "username",
                            email
                        )
                        .maybeSingle();


                if (profileError) {

                    console.error(
                        "❌ Gagal mengambil profile:",
                        profileError
                    );

                    alert(
                        "Gagal membaca data role admin."
                    );

                    window.location.href =
                        "toko.html";

                    return false;
                }


                if (!profile) {

                    console.log(
                        "❌ Profile tidak ditemukan."
                    );

                    alert(
                        "Data pengguna tidak ditemukan."
                    );

                    window.location.href =
                        "toko.html";

                    return false;
                }


                console.log(
                    "👤 PROFILE:",
                    profile
                );


                const role =
                    String(
                        profile.role || ""
                    )
                    .trim()
                    .toLowerCase();


                console.log(
                    "🛡️ ROLE:",
                    role
                );


                /* BUKAN ADMIN */

                if (role !== "admin") {

                    alert(
                        "Akses ditolak. Halaman ini hanya untuk Admin."
                    );

                    window.location.href =
                        "toko.html";

                    return false;
                }


                /* ADMIN BERHASIL */

                document.getElementById(
                    "adminName"
                ).textContent =
                    profile.name ||
                    profile.username ||
                    "Admin";


                document.getElementById(
                    "adminStatus"
                ).textContent =
                    "Admin Active";


                console.log(
                    "✅ ADMIN TERDETEKSI."
                );


                return true;

            } catch (error) {

                console.error(
                    "❌ Error checkAdmin:",
                    error
                );

                window.location.href =
                    "login.html";

                return false;
            }
        }


        /* =====================================================
           LOAD STATISTIK
        ===================================================== */

        async function loadStats() {

            try {

                console.log(
                    "📊 Mengambil statistik..."
                );


                /* TOTAL PESANAN */

                const {
                    count: ordersCount,
                    error: ordersError
                } =
                    await supabaseClient
                        .from("orders")
                        .select(
                            "*",
                            {
                                count: "exact",
                                head: true
                            }
                        );


                if (ordersError) {

                    console.error(
                        "❌ Error orders:",
                        ordersError
                    );

                } else {

                    document.getElementById(
                        "totalOrders"
                    ).textContent =
                        ordersCount || 0;

                }


                /* TOTAL PRODUK */

                const {
                    count: productsCount,
                    error: productsError
                } =
                    await supabaseClient
                        .from("products")
                        .select(
                            "*",
                            {
                                count: "exact",
                                head: true
                            }
                        );


                if (productsError) {

                    console.error(
                        "❌ Error products:",
                        productsError
                    );

                } else {

                    document.getElementById(
                        "totalProducts"
                    ).textContent =
                        productsCount || 0;

                }


                /* STATUS */

                document.getElementById(
                    "systemStatus"
                ).innerHTML =
                    `
                    <i class="fa-solid fa-circle-check"></i>
                    Dashboard berhasil terhubung ke Supabase.
                    `;


                console.log(
                    "✅ Statistik berhasil dimuat."
                );

            } catch (error) {

                console.error(
                    "❌ Gagal load statistik:",
                    error
                );

                document.getElementById(
                    "systemStatus"
                ).innerHTML =
                    `
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Gagal mengambil data dari Supabase.
                    `;

            }
        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        async function logout() {

            try {

                await supabaseClient.auth.signOut();

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }


            localStorage.removeItem(
                "user"
            );

            localStorage.removeItem(
                "currentUser"
            );

            localStorage.removeItem(
                "isLoggedIn"
            );

            localStorage.removeItem(
                "user_session"
            );


            window.location.href =
                "login.html";
        }


        /* =====================================================
           START
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            async function() {

                console.log(
                    "🚀 Admin Dashboard starting..."
                );


                const ready =
                    initializeSupabase();

                if (!ready) {
                    return;
                }


                /* CEK ADMIN DULU */

                const allowed =
                    await checkAdmin();

                if (!allowed) {
                    return;
                }


                /* BARU LOAD DATA */

                await loadStats();

            }
        );

    </script>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
