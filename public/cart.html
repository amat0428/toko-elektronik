<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja - BlueShop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f6f9; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
    .btn-back { background: #64748b; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; }
    .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; }
    .item-details { flex-grow: 1; margin-left: 15px; }
    .item-title { font-size: 16px; font-weight: bold; color: #1e293b; }
    .item-price { color: #2563eb; font-weight: bold; margin-top: 4px; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .cart-summary { margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 15px; text-align: right; }
    .total-price { font-size: 20px; font-weight: bold; color: #0f172a; margin-bottom: 15px; }
    .btn-checkout { background: #10b981; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .empty-cart { text-align: center; color: #64748b; padding: 40px 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Keranjang Belanja</h2>
      <a href="index.html" class="btn-back">← Kembali ke Toko</a>
    </div>

    <div id="cartList"></div>

    <div class="cart-summary" id="cartSummary" style="display: none;">
      <div class="total-price">Total: <span id="totalAmount">Rp 0</span></div>
      <button class="btn-checkout" onclick="checkout()">Buat Pesanan (Checkout)</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fbnknnrltrsvydyxgujr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibmtubnJsdHJzdnlkeXhndWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0MjYsImV4cCI6MjEwMzgxNjQyNn0.A46kddQQFKt8C-Kvq8Gt753acdEctsh7XibfMWKKP9o';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let cartItems = JSON.parse(localStorage.getItem('cart')) || [];
    const currentUser = JSON.parse(localStorage.getItem('user'));

    async function renderCart() {
      const container = document.getElementById('cartList');
      const summary = document.getElementById('cartSummary');
      
      if (cartItems.length === 0) {
        container.innerHTML = '<div class="empty-cart">Keranjang belanjaan kamu masih kosong.</div>';
        summary.style.display = 'none';
        return;
      }

      container.innerHTML = 'Loading...';

      // Ambil data produk berdasarkan ID di keranjang
      const ids = cartItems.map(item => item.id);
      const { data: products, error } = await _supabase
        .from('produk')
        .select('*')
        .in('id_produk', ids);

      if (error || !products) {
        container.innerHTML = '<div class="empty-cart">Gagal memuat data produk.</div>';
        return;
      }

      let html = '';
      let total = 0;

      cartItems.forEach(cartItem => {
        const prod = products.find(p => p.id_produk == cartItem.id);
        if (prod) {
          const itemTotal = prod.harga * (cartItem.qty || 1);
          total += itemTotal;
          html += `
            <div class="cart-item">
              <img src="${prod.gambar}" alt="${prod.nama_produk}">
              <div class="item-details">
                <div class="item-title">${prod.nama_produk}</div>
                <div class="item-price">Rp ${prod.harga.toLocaleString('id-ID')} x ${cartItem.qty || 1}</div>
              </div>
              <button class="btn-delete" onclick="removeItem(${prod.id_produk})">Hapus</button>
            </div>
          `;
        }
      });

      container.innerHTML = html;
      document.getElementById('totalAmount').innerText = `Rp ${total.toLocaleString('id-ID')}`;
      summary.style.display = 'block';
    }

    function removeItem(id) {
      cartItems = cartItems.filter(item => item.id != id);
      localStorage.setItem('cart', JSON.stringify(cartItems));
      renderCart();
    }

    async function checkout() {
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk checkout!");
        window.location.href = "login.html";
        return;
      }

      const confirmBuy = confirm("Apakah Anda yakin ingin melakukan pemesanan ini?");
      if (!confirmBuy) return;

      // Ambil detail produk untuk pesanan
      const ids = cartItems.map(item => item.id);
      const { data: products } = await _supabase.from('produk').select('*').in('id_produk', ids);

      let total = 0;
      const orderDetails = cartItems.map(item => {
        const prod = products.find(p => p.id_produk == item.id);
        const subtotal = (prod ? prod.harga : 0) * (item.qty || 1);
        total += subtotal;
        return {
          nama_produk: prod ? prod.nama_produk : 'Produk',
          qty: item.qty || 1,
          harga: prod ? prod.harga : 0
        };
      });

      // Insert ke tabel orders
      const { error } = await _supabase
        .from('orders')
        .insert([{
          user_id: currentUser.id,
          user_name: currentUser.name || currentUser.email,
          items: JSON.stringify(orderDetails),
          total_harga: total,
          status: 'Menunggu Konfirmasi'
        }]);

      if (error) {
        alert("Gagal membuat pesanan: " + error.message);
      } else {
        alert("Pesanan berhasil dibuat!");
        localStorage.removeItem('cart');
        window.location.href = 'pesanan.html';
      }
    }

    renderCart();
  </script>
</body>
</html>
