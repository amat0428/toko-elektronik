<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BlueShop</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #4f46e5;
            font-size: 30px;
        }

        .logo p {
            color: #64748b;
            font-size: 13px;
        }

        .tab-menu {
            display: flex;
            background: #eef2ff;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
        }

        .tab-btn.active {
            background: white;
            color: #4f46e5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
        }

        .form-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #334155;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 13px 42px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            background: #f8fafc;
            font-size: 14px;
        }

        input:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .alert.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .alert.success {
            display: block;
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            font-size: 13px;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOGO -->
        <div class="logo">
            <h1>BlueShop</h1>
            <p>Toko Elektronik Online</p>
        </div>

        <!-- TAB -->
        <div class="tab-menu">
            <button
                type="button"
                class="tab-btn active"
                onclick="switchTab('login')"
            >
                Masuk
            </button>

            <button
                type="button"
                class="tab-btn"
                onclick="switchTab('register')"
            >
                Daftar
            </button>
        </div>

        <!-- ALERT -->
        <div id="alertBox" class="alert"></div>

        <!-- ================= LOGIN ================= -->

        <div id="loginFormContainer" class="form-container active">

            <div class="form-title">
                Selamat Datang
            </div>

            <div class="form-subtitle">
                Silakan masuk ke akun BlueShop
            </div>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label>Email</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="nama@email.com"
                            required
                        >

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label>Kata Sandi</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Kata sandi"
                            required
                        >

                        <i
                            class="fa-solid fa-eye toggle-password"
                            onclick="togglePassword('loginPassword', this)"
                        ></i>

                    </div>

                </div>

                <!-- BUTTON -->
                <button
                    type="submit"
                    id="btnLogin"
                    class="submit-btn"
                >
                    Masuk
                </button>

            </form>

        </div>

        <!-- ================= REGISTER ================= -->

        <div id="registerFormContainer" class="form-container">

            <div class="form-title">
                Buat Akun
            </div>

            <div class="form-subtitle">
                Daftar untuk menggunakan BlueShop
            </div>

            <form id="registerForm">

                <!-- NAMA -->
                <div class="input-group">

                    <label>Nama Lengkap</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            type="text"
                            id="regName"
                            placeholder="Nama lengkap"
                            required
                        >

                    </div>

                </div>

                <!-- EMAIL -->
                <div class="input-group">

                    <label>Email</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="regEmail"
                            placeholder="nama@email.com"
                            required
                        >

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label>Kata Sandi</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="regPassword"
                            placeholder="Minimal 6 karakter"
                            required
                        >

                        <i
                            class="fa-solid fa-eye toggle-password"
                            onclick="togglePassword('regPassword', this)"
                        ></i>

                    </div>

                </div>

                <!-- BUTTON -->
                <button
                    type="submit"
                    id="btnRegister"
                    class="submit-btn"
                >
                    Daftar Sekarang
                </button>

            </form>

        </div>

        <!-- BACK -->
        <a href="index.html" class="back">
            ← Kembali ke Portfolio
        </a>

    </div>

</div>


<script>

    // =====================================================
    // KONFIGURASI SUPABASE
    // =====================================================

    const SUPABASE_URL =
        "https://fbnknnrltrsvydyxgujr.supabase.co";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibmtubnJsdHJzdnlkeXhndWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0MjYsImV4cCI6MjEwMzgxNjQyNn0.A46kddQQFKt8C-Kvq8Gt753acdEctsh7XibfMWKKP9o";


    // =====================================================
    // CEK SUPABASE
    // =====================================================

    if (!window.supabase) {

        console.error("Supabase JS gagal dimuat.");

        alert(
            "Supabase gagal dimuat. Periksa koneksi internet atau CDN."
        );

    }


    // =====================================================
    // BUAT SUPABASE CLIENT
    // =====================================================

    const _supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // Nama tabel
    const TABLE_NAME = "users_list";


    // =====================================================
    // SWITCH TAB
    // =====================================================

    function switchTab(tab) {

        const login =
            document.getElementById("loginFormContainer");

        const register =
            document.getElementById("registerFormContainer");

        const buttons =
            document.querySelectorAll(".tab-btn");

        hideAlert();


        if (tab === "login") {

            login.classList.add("active");

            register.classList.remove("active");

            buttons[0].classList.add("active");

            buttons[1].classList.remove("active");

        } else {

            register.classList.add("active");

            login.classList.remove("active");

            buttons[1].classList.add("active");

            buttons[0].classList.remove("active");

        }

    }


    // =====================================================
    // TOGGLE PASSWORD
    // =====================================================

    function togglePassword(inputId, icon) {

        const input =
            document.getElementById(inputId);


        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }


    // =====================================================
    // ALERT
    // =====================================================

    function showAlert(message, type = "error") {

        const box =
            document.getElementById("alertBox");

        box.textContent = message;

        box.className =
            "alert " + type;

    }


    function hideAlert() {

        const box =
            document.getElementById("alertBox");

        box.className = "alert";

        box.textContent = "";

    }


    // =====================================================
    // LOGIN
    // =====================================================

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            hideAlert();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const button =
                document.getElementById("btnLogin");


            button.disabled = true;

            button.textContent = "Memeriksa...";


            try {

                console.log("Mencoba login:", email);


                const {
                    data,
                    error
                } = await _supabase

                    .from(TABLE_NAME)

                    .select("*")

                    .eq("username", email)

                    .eq("password", password)

                    .limit(1);


                if (error) {

                    console.error(
                        "Supabase Login Error:",
                        error
                    );

                    throw error;

                }


                if (!data || data.length === 0) {

                    showAlert(
                        "Email atau password salah!"
                    );

                    return;

                }


                // User ditemukan
                const user = data[0];


                // Simpan data user
                localStorage.setItem(
                    "user",
                    JSON.stringify(user)
                );


                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(user)
                );


                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                showAlert(
                    "Login berhasil! Membuka toko...",
                    "success"
                );


                // Pindah ke toko
                setTimeout(function() {

                    window.location.href =
                        "toko.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                showAlert(
                    "Gagal Login: " +
                    (
                        error.message ||
                        "Kesalahan sistem"
                    )
                );

            } finally {

                button.disabled = false;

                button.textContent = "Masuk";

            }

        });


    // =====================================================
    // REGISTER
    // =====================================================

    document
        .getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            hideAlert();


            const name =
                document
                    .getElementById("regName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("regEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("regPassword")
                    .value;


            const button =
                document.getElementById("btnRegister");


            // Cek password
            if (password.length < 6) {

                showAlert(
                    "Password minimal 6 karakter!"
                );

                return;

            }


            button.disabled = true;

            button.textContent = "Mendaftarkan...";


            try {

                // -----------------------------------------
                // CEK EMAIL SUDAH ADA
                // -----------------------------------------

                const {
                    data: existing,
                    error: checkError
                } = await _supabase

                    .from(TABLE_NAME)

                    .select("id")

                    .eq("username", email)

                    .limit(1);


                if (checkError) {

                    throw checkError;

                }


                if (
                    existing &&
                    existing.length > 0
                ) {

                    showAlert(
                        "Email sudah terdaftar!"
                    );

                    return;

                }


                // -----------------------------------------
                // INSERT USER BARU
                // -----------------------------------------

                const {
                    error: insertError
                } = await _supabase

                    .from(TABLE_NAME)

                    .insert({

                        name: name,

                        username: email,

                        password: password,

                        role: "user"

                    });


                if (insertError) {

                    throw insertError;

                }


                // Berhasil
                showAlert(
                    "Pendaftaran berhasil! Silakan login.",
                    "success"
                );


                // Pindah ke login
                setTimeout(function() {

                    switchTab("login");

                    document
                        .getElementById("loginEmail")
                        .value = email;

                }, 1000);


            } catch (error) {

                console.error(
                    "Register Error:",
                    error
                );


                showAlert(
                    "Gagal daftar: " +
                    (
                        error.message ||
                        "Kesalahan sistem"
                    )
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Daftar Sekarang";

            }

        });

</script>

</body>
</html>
```
