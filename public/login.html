<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Masuk & Daftar - BlueShop</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            overflow: hidden;
            position: relative;
        }

        /* Elemen Dekorasi Latar Belakang */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 1;
        }
        .circle-1 {
            width: 250px;
            height: 250px;
            top: -50px;
            left: -50px;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -80px;
            right: -80px;
        }

        /* Card Container Utama */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Navigasi Tab */
        .tab-menu {
            display: flex;
            background: #eef2ff;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #4f46e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Alert Pesan Notifikasi */
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert.error {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            display: block;
        }
        .alert.success {
            background-color: #dcfce7;
            color: #16a34a;
            border: 1px solid #86efac;
            display: block;
        }

        /* Form Styling */
        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
            text-align: center;
        }

        .form-subtitle {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 42px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 15px;
        }

        .toggle-password:hover {
            color: #4f46e5;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            cursor: pointer;
        }

        .forgot-pass {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* Tombol Utama */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .submit-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Lingkaran Dekorasi Latar Belakang -->
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>

    <div class="container">
        <div class="card">
            
            <!-- Tab Menu -->
            <div class="tab-menu">
                <button class="tab-btn active" onclick="switchTab('login')">Masuk</button>
                <button class="tab-btn" onclick="switchTab('register')">Daftar</button>
            </div>

            <!-- Pesan Alert Status -->
            <div id="alertBox" class="alert"></div>

            <!-- FORM LOGIN -->
            <div id="loginFormContainer" class="form-container active">
                <div class="form-title">BlueShop</div>
                <div class="form-subtitle">Belanja elektronik lebih mudah</div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="loginEmail">Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="loginEmail" placeholder="nama@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Kata Sandi</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe"> Ingat saya
                        </label>
                        <a href="#" class="forgot-pass" onclick="alert('Lupa password dapat dikonfigurasi lewat Supabase Auth.')">Lupa sandi?</a>
                    </div>

                    <button type="submit" id="btnLogin" class="submit-btn">Masuk</button>
                </form>
            </div>

            <!-- FORM REGISTER -->
            <div id="registerFormContainer" class="form-container">
                <div class="form-title">Buat Akun Baru</div>
                <div class="form-subtitle">Lengkapi data untuk mendaftar</div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="input-group">
                        <label for="regName">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="regName" placeholder="Ahmad Alvi" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regEmail">Email</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="regEmail" placeholder="nama@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">Kata Sandi</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
                        </div>
                    </div>

                    <button type="submit" id="btnRegister" class="submit-btn">Daftar Sekarang</button>
                </form>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // =====================================================
        // KONFIGURASI SUPABASE (Path URL tanpa /rest/v1/)
        // =====================================================
        const SUPABASE_URL = "https://fbnknrltrsvydyxgujr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibmtubnJsdHJzdnlkeXhndWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0MjYsImV4cCI6MjEwMzgxNjQyNn0.A46kddQQFKt8C-Kvq8Gt753acdEctsh7XibfMWKKP9o";

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const TABLE_NAME = "users_list"; // Ganti dengan nama tabel database kamu jika berbeda

        // =====================================================
        // UTILS & HELPER
        // =====================================================
        function switchTab(tab) {
            const loginContainer = document.getElementById('loginFormContainer');
            const registerContainer = document.getElementById('registerFormContainer');
            const tabs = document.querySelectorAll('.tab-btn');

            hideAlert();

            if (tab === 'login') {
                loginContainer.classList.add('active');
                registerContainer.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                registerContainer.classList.add('active');
                loginContainer.classList.remove('active');
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        function togglePasswordVisibility(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = message;
            alertBox.className = `alert ${type}`;
        }

        function hideAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';
        }

        // =====================================================
        // PROSES LOGIN & REDIRECT KE TOKO
        // =====================================================
        async function handleLogin(event) {
            event.preventDefault();
            hideAlert();

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerText = 'Memeriksa...';

            try {
                // Mencari akun pengguna berdasarkan username/email dan password di tabel Supabase
                const { data: user, error } = await _supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .eq('username', email)
                    .eq('password', password)
                    .maybeSingle();

                if (error) throw error;

                if (!user) {
                    showAlert("Email atau password salah!");
                    return;
                }

                showAlert("Login berhasil! Mengalihkan ke toko...", "success");

                // Simpan data login singkat ke LocalStorage
                localStorage.setItem("user_session", JSON.stringify(user));

                // Pengalihan otomatis ke halaman toko.html setelah 1.2 detik
                setTimeout(() => {
                    window.location.href = "toko.html";
                }, 1200);

            } catch (err) {
                console.error("Login Error:", err);
                showAlert(err.message || "Gagal Login: Terjadi kesalahan server.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Masuk';
            }
        }

        // =====================================================
        // PROSES REGISTER
        // =====================================================
        async function handleRegister(event) {
            event.preventDefault();
            hideAlert();

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('btnRegister');

            if (password.length < 6) {
                showAlert("Kata sandi minimal 6 karakter!");
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Mendaftarkan...';

            try {
                // Cek ketersediaan email
                const { data: existingUser, error: checkError } = await _supabase
                    .from(TABLE_NAME)
                    .select('id')
                    .eq('username', email)
                    .maybeSingle();

                if (checkError) throw checkError;

                if (existingUser) {
                    showAlert("Email sudah terdaftar. Silakan langsung masuk!");
                    return;
                }

                // Masukkan user baru ke database
                const { error: insertError } = await _supabase
                    .from(TABLE_NAME)
                    .insert([{
                        name: name,
                        username: email,
                        password: password,
                        role: "user"
                    }]);

                if (insertError) throw insertError;

                showAlert("Pendaftaran berhasil! Silakan masuk.", "success");

                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('loginEmail').value = email;
                }, 1500);

            } catch (err) {
                console.error("Register Error:", err);
                showAlert(err.message || "Gagal mendaftar. Coba lagi.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Daftar Sekarang';
            }
        }
    </script>
</body>
</html>
