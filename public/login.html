<script>
    /* =====================================================
       KONFIGURASI SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://fbnknnrltrsvydyxgujr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_JStXk700ejTvHYnjAHlCYA_1tf1Kccp";


    /* =====================================================
       CEK SUPABASE
    ===================================================== */

    if (!window.supabase) {
        console.error("Supabase JS gagal dimuat.");

        alert(
            "Supabase gagal dimuat. Periksa koneksi internet atau CDN."
        );
    }


    /* =====================================================
       CREATE SUPABASE CLIENT
    ===================================================== */

    const supabaseClient = window.supabase
        ? window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        )
        : null;


    if (!supabaseClient) {
        console.error(
            "Supabase Client gagal dibuat."
        );
    } else {
        console.log(
            "✅ Supabase berhasil terhubung."
        );
    }


    /* =====================================================
       SWITCH TAB
    ===================================================== */

    function switchTab(tab) {

        const login =
            document.getElementById(
                "loginFormContainer"
            );

        const register =
            document.getElementById(
                "registerFormContainer"
            );

        const buttons =
            document.querySelectorAll(
                ".tab-btn"
            );

        hideAlert();

        if (tab === "login") {

            login.classList.add("active");
            register.classList.remove("active");

            buttons[0].classList.add("active");
            buttons[1].classList.remove("active");

        } else {

            register.classList.add("active");
            login.classList.remove("active");

            buttons[1].classList.add("active");
            buttons[0].classList.remove("active");
        }
    }


    /* =====================================================
       TOGGLE PASSWORD
    ===================================================== */

    function togglePassword(inputId, icon) {

        const input =
            document.getElementById(inputId);

        if (!input) return;

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }


    /* =====================================================
       ALERT
    ===================================================== */

    function showAlert(message, type = "error") {

        const box =
            document.getElementById("alertBox");

        box.textContent = message;

        box.className =
            "alert " + type;
    }


    function hideAlert() {

        const box =
            document.getElementById("alertBox");

        box.className = "alert";
        box.textContent = "";
    }


    /* =====================================================
       SYNC USER KE users_list
    ===================================================== */

    async function syncUserToTable(user, name = null) {

        if (!user) return null;

        try {

            const email =
                user.email || "";


            /* CARI USER */

            const {
                data: existingUser,
                error: findError
            } = await supabaseClient
                .from("users_list")
                .select("id, name, username, role")
                .eq("username", email)
                .maybeSingle();


            if (findError) {

                console.error(
                    "Gagal mencari users_list:",
                    findError
                );

                return null;
            }


            /* USER SUDAH ADA */

            if (existingUser) {

                console.log(
                    "User sudah ada:",
                    existingUser
                );

                return existingUser;
            }


            /* USER BELUM ADA */

            const {
                data: newUser,
                error: insertError
            } = await supabaseClient
                .from("users_list")
                .insert([
                    {
                        name:
                            name ||
                            user.user_metadata?.name ||
                            "User",

                        username:
                            email,

                        role:
                            "user"
                    }
                ])
                .select()
                .single();


            if (insertError) {

                console.error(
                    "Gagal memasukkan users_list:",
                    insertError
                );

                throw insertError;
            }


            console.log(
                "User berhasil masuk users_list:",
                newUser
            );

            return newUser;

        } catch (error) {

            console.error(
                "Sync users_list error:",
                error
            );

            throw error;
        }
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();
                hideAlert();


                if (!supabaseClient) {

                    showAlert(
                        "Supabase belum siap."
                    );

                    return;
                }


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                const button =
                    document.getElementById(
                        "btnLogin"
                    );


                button.disabled = true;

                button.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';


                try {

                    console.log(
                        "Mencoba login:",
                        email
                    );


                    /* LOGIN SUPABASE AUTH */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                    if (error) {

                        console.error(
                            "Login Error:",
                            error
                        );


                        const message =
                            (
                                error.message ||
                                ""
                            ).toLowerCase();


                        if (
                            error.status === 429 ||
                            message.includes("rate limit") ||
                            message.includes("too many requests")
                        ) {

                            showAlert(
                                "Terlalu banyak percobaan. Silakan tunggu beberapa saat."
                            );

                        } else if (
                            message.includes(
                                "email not confirmed"
                            )
                        ) {

                            showAlert(
                                "Email belum dikonfirmasi. Periksa email kamu."
                            );

                        } else if (
                            message.includes(
                                "invalid login credentials"
                            )
                        ) {

                            showAlert(
                                "Email atau password salah."
                            );

                        } else if (
                            message.includes(
                                "invalid api key"
                            )
                        ) {

                            showAlert(
                                "API Key Supabase tidak valid."
                            );

                        } else {

                            showAlert(
                                "Gagal login: " +
                                error.message
                            );
                        }

                        return;
                    }


                    if (!data || !data.user) {

                        showAlert(
                            "Akun tidak ditemukan."
                        );

                        return;
                    }


                    /* USER BERHASIL LOGIN */

                    const user =
                        data.user;


                    console.log(
                        "✅ Login berhasil:",
                        user.email
                    );


                    /* SYNC users_list */

                    let profile = null;

                    try {

                        profile =
                            await syncUserToTable(
                                user,
                                user.user_metadata?.name
                            );

                    } catch (profileError) {

                        console.error(
                            "Gagal sync users_list:",
                            profileError
                        );
                    }


                    /* AMBIL ROLE */

                    let role = "user";


                    if (
                        profile &&
                        profile.role
                    ) {

                        role =
                            profile.role;

                    } else {

                        const {
                            data: profileData
                        } =
                            await supabaseClient
                                .from("users_list")
                                .select("role, name")
                                .eq(
                                    "username",
                                    user.email
                                )
                                .maybeSingle();


                        if (
                            profileData &&
                            profileData.role
                        ) {

                            role =
                                profileData.role;
                        }
                    }


                    /* DATA USER */

                    const userData = {

                        id:
                            user.id,

                        email:
                            user.email,

                        name:
                            profile?.name ||
                            user.user_metadata?.name ||
                            "User",

                        role:
                            role
                    };


                    /* LOCAL STORAGE */

                    localStorage.setItem(
                        "user",
                        JSON.stringify(userData)
                    );

                    localStorage.setItem(
                        "currentUser",
                        JSON.stringify(userData)
                    );

                    localStorage.setItem(
                        "isLoggedIn",
                        "true"
                    );


                    console.log(
                        "Data user:",
                        userData
                    );


                    showAlert(
                        "Login berhasil! Membuka toko...",
                        "success"
                    );


                    /* REDIRECT */

                    setTimeout(function () {

                        const params =
                            new URLSearchParams(
                                window.location.search
                            );


                        let redirectTo =
                            params.get("redirect") ||
                            "toko.html";


                        /* CEGAH REDIRECT EKSTERNAL */

                        if (
                            redirectTo.startsWith("http://") ||
                            redirectTo.startsWith("https://") ||
                            redirectTo.startsWith("//")
                        ) {

                            redirectTo =
                                "toko.html";
                        }


                        window.location.href =
                            redirectTo;

                    }, 800);


                } catch (error) {

                    console.error(
                        "Login Error:",
                        error
                    );


                    showAlert(
                        "Gagal login: " +
                        (
                            error.message ||
                            "Kesalahan sistem"
                        )
                    );

                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Masuk";
                }
            }
        );


    /* =====================================================
       REGISTER
    ===================================================== */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();
                hideAlert();


                if (!supabaseClient) {

                    showAlert(
                        "Supabase belum siap."
                    );

                    return;
                }


                const name =
                    document
                        .getElementById("regName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("regEmail")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("regPassword")
                        .value;


                const button =
                    document.getElementById(
                        "btnRegister"
                    );


                /* VALIDASI */

                if (!name) {

                    showAlert(
                        "Nama lengkap wajib diisi."
                    );

                    return;
                }


                if (!email) {

                    showAlert(
                        "Email wajib diisi."
                    );

                    return;
                }


                if (password.length < 6) {

                    showAlert(
                        "Password minimal 6 karakter."
                    );

                    return;
                }


                button.disabled = true;

                button.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Mendaftarkan...';


                try {

                    console.log(
                        "Mendaftarkan:",
                        email
                    );


                    /* REGISTER AUTH */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email:
                                email,

                            password:
                                password,

                            options: {

                                data: {
                                    name:
                                        name
                                }
                            }
                        });


                    if (error) {

                        console.error(
                            "Register Error:",
                            error
                        );


                        const message =
                            (
                                error.message ||
                                ""
                            ).toLowerCase();


                        if (
                            error.status === 429 ||
                            message.includes("rate limit") ||
                            message.includes("too many requests")
                        ) {

                            showAlert(
                                "Terlalu banyak percobaan pendaftaran. Tunggu beberapa saat."
                            );

                        } else if (
                            message.includes(
                                "signups not allowed"
                            )
                        ) {

                            showAlert(
                                "Pendaftaran belum diizinkan di Supabase."
                            );

                        } else if (
                            message.includes(
                                "already registered"
                            ) ||
                            message.includes(
                                "already exists"
                            )
                        ) {

                            showAlert(
                                "Email tersebut sudah terdaftar. Silakan masuk."
                            );

                        } else if (
                            message.includes(
                                "invalid api key"
                            )
                        ) {

                            showAlert(
                                "API Key Supabase tidak valid."
                            );

                        } else {

                            showAlert(
                                "Gagal daftar: " +
                                error.message
                            );
                        }

                        return;
                    }


                    if (!data || !data.user) {

                        showAlert(
                            "Pendaftaran gagal. Silakan coba lagi."
                        );

                        return;
                    }


                    console.log(
                        "✅ Register Auth berhasil:",
                        data.user
                    );


                    /* SYNC users_list */

                    try {

                        await syncUserToTable(
                            data.user,
                            name
                        );

                    } catch (tableError) {

                        console.error(
                            "Gagal users_list:",
                            tableError
                        );

                        showAlert(
                            "Akun berhasil dibuat, tetapi data users_list gagal disimpan."
                        );

                        return;
                    }


                    /* HASIL REGISTER */

                    if (!data.session) {

                        showAlert(
                            "Pendaftaran berhasil! Silakan cek email untuk verifikasi.",
                            "success"
                        );

                    } else {

                        showAlert(
                            "Pendaftaran berhasil! Silakan login.",
                            "success"
                        );
                    }


                    /* PINDAH LOGIN */

                    setTimeout(function () {

                        switchTab("login");

                        document
                            .getElementById(
                                "loginEmail"
                            )
                            .value =
                            email;

                    }, 1500);


                } catch (error) {

                    console.error(
                        "Register Error:",
                        error
                    );


                    showAlert(
                        "Gagal daftar: " +
                        (
                            error.message ||
                            "Kesalahan sistem"
                        )
                    );

                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Daftar Sekarang";
                }
            }
        );


    /* =====================================================
       CEK SESSION
    ===================================================== */

    async function checkSession() {

        if (!supabaseClient) return;

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Session Error:",
                    error
                );

                return;
            }


            if (data.session) {

                console.log(
                    "Session aktif:",
                    data.session.user.email
                );

            } else {

                console.log(
                    "Belum ada session."
                );
            }

        } catch (error) {

            console.error(
                "Check Session Error:",
                error
            );
        }
    }


    /* JALANKAN */

    checkSession();
</script>
