<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BlueShop</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(79, 70, 229, 0.45),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(6, 182, 212, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #ecfeff
                );
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 390px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            padding: 28px 26px;
            border-radius: 18px;
            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 4px 15px rgba(15, 23, 42, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* LOGO */
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #4f46e5;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #64748b;
            font-size: 12px;
            margin-top: 2px;
        }

        /* TAB */
        .tab-menu {
            display: flex;
            background: #eef2ff;
            padding: 4px;
            border-radius: 9px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 9px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .tab-btn.active {
            background: white;
            color: #4f46e5;
            box-shadow:
                0 2px 7px rgba(0, 0, 0, 0.08);
        }

        /* FORM */
        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .form-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #334155;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
            z-index: 2;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 10px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            background: #f8fafc;
            font-size: 13px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* PASSWORD TOGGLE */
        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: #4f46e5;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            height: 44px;
            border: none;
            padding: 10px;
            border-radius: 9px;
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #06b6d4
                );
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow:
                0 5px 15px rgba(79, 70, 229, 0.2);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ALERT */
        .alert {
            display: none;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            line-height: 1.5;
        }

        .alert.error {
            display: block;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .alert.success {
            display: block;
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        /* BACK */
        .back {
            display: block;
            text-align: center;
            margin-top: 17px;
            color: #4f46e5;
            font-size: 12px;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (min-width: 768px) {
            body {
                padding: 40px;
            }

            .container {
                max-width: 370px;
            }

            .card {
                padding: 30px 28px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 14px;
            }

            .container {
                max-width: 100%;
            }

            .card {
                padding: 24px 20px;
                border-radius: 16px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOGO -->
        <div class="logo">
            <h1>BlueShop</h1>
            <p>Toko Elektronik Online</p>
        </div>

        <!-- TAB -->
        <div class="tab-menu">
            <button
                type="button"
                class="tab-btn active"
                onclick="switchTab('login')"
            >
                Masuk
            </button>

            <button
                type="button"
                class="tab-btn"
                onclick="switchTab('register')"
            >
                Daftar
            </button>
        </div>

        <!-- ALERT -->
        <div id="alertBox" class="alert"></div>

        <!-- ================= LOGIN ================= -->

        <div
            id="loginFormContainer"
            class="form-container active"
        >

            <div class="form-title">
                Selamat Datang
            </div>

            <div class="form-subtitle">
                Silakan masuk ke akun BlueShop
            </div>

            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="nama@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="loginPassword">
                        Kata Sandi
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Kata sandi"
                            autocomplete="current-password"
                            required
                        >

                        <i
                            class="fa-solid fa-eye toggle-password"
                            onclick="togglePassword('loginPassword', this)"
                        ></i>

                    </div>
                </div>

                <button
                    type="submit"
                    id="btnLogin"
                    class="submit-btn"
                >
                    Masuk
                </button>

            </form>
        </div>

        <!-- ================= REGISTER ================= -->

        <div
            id="registerFormContainer"
            class="form-container"
        >

            <div class="form-title">
                Buat Akun
            </div>

            <div class="form-subtitle">
                Daftar untuk menggunakan BlueShop
            </div>

            <form id="registerForm">

                <!-- NAMA -->
                <div class="input-group">

                    <label for="regName">
                        Nama Lengkap
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user input-icon"></i>

                        <input
                            type="text"
                            id="regName"
                            placeholder="Nama lengkap"
                            autocomplete="name"
                            required
                        >

                    </div>
                </div>

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="regEmail">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="regEmail"
                            placeholder="nama@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="regPassword">
                        Kata Sandi
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="regPassword"
                            placeholder="Minimal 6 karakter"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <i
                            class="fa-solid fa-eye toggle-password"
                            onclick="togglePassword('regPassword', this)"
                        ></i>

                    </div>
                </div>

                <button
                    type="submit"
                    id="btnRegister"
                    class="submit-btn"
                >
                    Daftar Sekarang
                </button>

            </form>
        </div>

        <!-- BACK -->
        <a
            href="index.html"
            class="back"
        >
            ← Kembali ke Portfolio
        </a>

    </div>
</div>


<script>

/* =====================================================
   KONFIGURASI SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://fbnknnrltrsvydyxgujr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_JStXk700ejTvHYnjAHlCYA_1tf1Kccp";


/* =====================================================
   CEK SUPABASE JS
===================================================== */

if (!window.supabase) {

    console.error("Supabase JS gagal dimuat.");

    alert(
        "Supabase gagal dimuat. Periksa koneksi internet atau CDN."
    );

}


/* =====================================================
   BUAT SUPABASE CLIENT
===================================================== */

const supabaseClient = window.supabase
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    )
    : null;


if (!supabaseClient) {

    console.error(
        "Supabase Client gagal dibuat."
    );

} else {

    console.log(
        "Supabase JS berhasil dimuat."
    );

}


/* =====================================================
   SWITCH TAB
===================================================== */

function switchTab(tab) {

    const login =
        document.getElementById(
            "loginFormContainer"
        );

    const register =
        document.getElementById(
            "registerFormContainer"
        );

    const buttons =
        document.querySelectorAll(
            ".tab-btn"
        );

    hideAlert();

    if (tab === "login") {

        login.classList.add("active");
        register.classList.remove("active");

        buttons[0].classList.add("active");
        buttons[1].classList.remove("active");

    } else {

        register.classList.add("active");
        login.classList.remove("active");

        buttons[1].classList.add("active");
        buttons[0].classList.remove("active");

    }
}


/* =====================================================
   TOGGLE PASSWORD
===================================================== */

function togglePassword(inputId, icon) {

    const input =
        document.getElementById(inputId);

    if (!input) {
        return;
    }

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }
}


/* =====================================================
   ALERT
===================================================== */

function showAlert(message, type = "error") {

    const box =
        document.getElementById("alertBox");

    box.textContent = message;

    box.className =
        "alert " + type;
}


function hideAlert() {

    const box =
        document.getElementById("alertBox");

    box.className = "alert";

    box.textContent = "";
}


/* =====================================================
   SIMPAN DATA USER KE users_list
===================================================== */

async function syncUserToTable(user, name = null) {

    if (!user) {
        return;
    }

    try {

        const email =
            user.email || "";

        /*
         * Cari user berdasarkan username/email
         */
        const { data: existingUser, error: findError } =
            await supabaseClient
                .from("users_list")
                .select("id, name, username, role")
                .eq("username", email)
                .maybeSingle();


        if (findError) {

            console.error(
                "Gagal mencari users_list:",
                findError
            );

            return;
        }


        /*
         * Kalau sudah ada, jangan buat data baru
         */
        if (existingUser) {

            console.log(
                "User sudah ada di users_list:",
                existingUser
            );

            return existingUser;
        }


        /*
         * Kalau belum ada, buat data baru
         *
         * password TIDAK disimpan.
         */
        const { data: newUser, error: insertError } =
            await supabaseClient
                .from("users_list")
                .insert([
                    {
                        name: name || user.user_metadata?.name || "User",
                        username: email,
                        role: "user"
                    }
                ])
                .select()
                .single();


        if (insertError) {

            console.error(
                "Gagal memasukkan user ke users_list:",
                insertError
            );

            throw insertError;
        }


        console.log(
            "User berhasil masuk users_list:",
            newUser
        );

        return newUser;

    } catch (error) {

        console.error(
            "Sync users_list error:",
            error
        );

        throw error;
    }
}


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideAlert();

            if (!supabaseClient) {

                showAlert(
                    "Supabase belum siap."
                );

                return;
            }


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const button =
                document.getElementById(
                    "btnLogin"
                );


            button.disabled = true;
            button.textContent = "Memeriksa...";


            try {

                console.log(
                    "Mencoba login:",
                    email
                );


                /* =========================
                   SUPABASE AUTH LOGIN
                ========================= */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,
                        password: password

                    });


                if (error) {

                    console.error(
                        "Supabase Login Error:",
                        error
                    );


                    const message =
                        (error.message || "")
                            .toLowerCase();


                    if (
                        error.status === 429 ||
                        message.includes("rate limit") ||
                        message.includes("too many requests")
                    ) {

                        showAlert(
                            "Terlalu banyak percobaan. Silakan tunggu beberapa saat."
                        );

                    } else if (
                        message.includes(
                            "email not confirmed"
                        )
                    ) {

                        showAlert(
                            "Email belum dikonfirmasi. Periksa email kamu."
                        );

                    } else if (
                        message.includes(
                            "invalid login credentials"
                        )
                    ) {

                        showAlert(
                            "Email atau password salah."
                        );

                    } else if (
                        message.includes(
                            "invalid api key"
                        )
                    ) {

                        showAlert(
                            "API Key Supabase tidak valid."
                        );

                    } else {

                        showAlert(
                            "Gagal login: " +
                            error.message
                        );
                    }

                    return;
                }


                if (
                    !data ||
                    !data.user
                ) {

                    showAlert(
                        "Akun tidak ditemukan."
                    );

                    return;
                }


                /* =========================
                   USER BERHASIL LOGIN
                ========================= */

                const user =
                    data.user;


                console.log(
                    "Login berhasil:",
                    user.email
                );


                /* =========================
                   SYNC KE users_list
                ========================= */

                let profile = null;

                try {

                    profile =
                        await syncUserToTable(
                            user,
                            user.user_metadata?.name
                        );

                } catch (profileError) {

                    console.error(
                        "Gagal sync users_list:",
                        profileError
                    );

                    /*
                     * Login tetap berhasil.
                     * Data Auth sudah valid.
                     */
                }


                /* =========================
                   AMBIL ROLE
                ========================= */

                let role = "user";

                if (profile && profile.role) {

                    role =
                        profile.role;

                } else {

                    const {
                        data: profileData
                    } =
                        await supabaseClient
                            .from("users_list")
                            .select("role, name")
                            .eq("username", user.email)
                            .maybeSingle();


                    if (
                        profileData &&
                        profileData.role
                    ) {

                        role =
                            profileData.role;
                    }
                }


                /* =========================
                   SIMPAN LOCAL STORAGE
                ========================= */

                const userData = {

                    id: user.id,

                    email: user.email,

                    name:
                        profile?.name ||
                        user.user_metadata?.name ||
                        "User",

                    role: role

                };


                localStorage.setItem(
                    "user",
                    JSON.stringify(userData)
                );

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(userData)
                );

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                console.log(
                    "Data user:",
                    userData
                );


                showAlert(
                    "Login berhasil! Membuka toko...",
                    "success"
                );


                /* =========================
                   REDIRECT
                ========================= */

                setTimeout(function () {

                    const params =
                        new URLSearchParams(
                            window.location.search
                        );


                    let redirectTo =
                        params.get("redirect") ||
                        "toko.html";


                    /*
                     * Cegah redirect ke website luar
                     */
                    if (
                        redirectTo.startsWith("http://") ||
                        redirectTo.startsWith("https://") ||
                        redirectTo.startsWith("//")
                    ) {

                        redirectTo =
                            "toko.html";
                    }


                    window.location.href =
                        redirectTo;

                }, 800);


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                showAlert(
                    "Gagal login: " +
                    (
                        error.message ||
                        "Kesalahan sistem"
                    )
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Masuk";
            }

        }
    );


/* =====================================================
   REGISTER
===================================================== */

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideAlert();

            if (!supabaseClient) {

                showAlert(
                    "Supabase belum siap."
                );

                return;
            }


            const name =
                document
                    .getElementById("regName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("regEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("regPassword")
                    .value;


            const button =
                document.getElementById(
                    "btnRegister"
                );


            /* =========================
               VALIDASI
            ========================= */

            if (!name) {

                showAlert(
                    "Nama lengkap wajib diisi."
                );

                return;
            }


            if (!email) {

                showAlert(
                    "Email wajib diisi."
                );

                return;
            }


            if (password.length < 6) {

                showAlert(
                    "Password minimal 6 karakter."
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "Mendaftarkan...";


            try {

                console.log(
                    "Mendaftarkan:",
                    email
                );


                /* =========================
                   SUPABASE AUTH REGISTER
                ========================= */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {
                                name: name
                            }

                        }

                    });


                if (error) {

                    console.error(
                        "Supabase Register Error:",
                        error
                    );


                    const message =
                        (error.message || "")
                            .toLowerCase();


                    if (
                        error.status === 429 ||
                        message.includes("rate limit") ||
                        message.includes("too many requests")
                    ) {

                        showAlert(
                            "Terlalu banyak percobaan pendaftaran. Tunggu beberapa saat sebelum mencoba lagi."
                        );

                    } else if (
                        message.includes(
                            "signups not allowed"
                        )
                    ) {

                        showAlert(
                            "Pendaftaran belum diizinkan. Aktifkan Allow new users to sign up di Supabase."
                        );

                    } else if (
                        message.includes(
                            "already registered"
                        ) ||
                        message.includes(
                            "already exists"
                        )
                    ) {

                        showAlert(
                            "Email tersebut sudah terdaftar. Silakan masuk."
                        );

                    } else if (
                        message.includes(
                            "invalid api key"
                        )
                    ) {

                        showAlert(
                            "API Key Supabase tidak valid."
                        );

                    } else {

                        showAlert(
                            "Gagal daftar: " +
                            error.message
                        );
                    }

                    return;
                }


                if (
                    !data ||
                    !data.user
                ) {

                    showAlert(
                        "Pendaftaran gagal. Silakan coba lagi."
                    );

                    return;
                }


                /* =========================
                   REGISTER AUTH BERHASIL
                ========================= */

                console.log(
                    "Register Auth berhasil:",
                    data.user
                );


                /* =========================
                   MASUKKAN KE users_list
                ========================= */

                try {

                    await syncUserToTable(
                        data.user,
                        name
                    );

                    console.log(
                        "Data berhasil masuk users_list."
                    );

                } catch (tableError) {

                    console.error(
                        "Gagal memasukkan users_list:",
                        tableError
                    );


                    showAlert(
                        "Akun berhasil dibuat, tetapi data users_list gagal disimpan: " +
                        tableError.message
                    );

                    return;
                }


                /* =========================
                   HASIL REGISTER
                ========================= */

                if (!data.session) {

                    showAlert(
                        "Pendaftaran berhasil! Silakan cek email untuk verifikasi.",
                        "success"
                    );

                } else {

                    showAlert(
                        "Pendaftaran berhasil! Silakan login.",
                        "success"
                    );
                }


                /* =========================
                   PINDAH KE LOGIN
                ========================= */

                setTimeout(function () {

                    switchTab("login");

                    document
                        .getElementById(
                            "loginEmail"
                        )
                        .value = email;

                }, 1500);


            } catch (error) {

                console.error(
                    "Register Error:",
                    error
                );


                showAlert(
                    "Gagal daftar: " +
                    (
                        error.message ||
                        "Kesalahan sistem"
                    )
                );

            } finally {

                button.disabled = false;

                button.textContent =
                    "Daftar Sekarang";
            }

        }
    );


/* =====================================================
   CEK SESSION SAAT HALAMAN DIBUKA
===================================================== */

async function checkSession() {

    if (!supabaseClient) {
        return;
    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session Error:",
                error
            );

            return;
        }


        if (data.session) {

            console.log(
                "Session aktif:",
                data.session.user.email
            );

        } else {

            console.log(
                "Belum ada session."
            );
        }


    } catch (error) {

        console.error(
            "Check Session Error:",
            error
        );
    }
}


/* =====================================================
   JALANKAN
===================================================== */

checkSession();

</script>
