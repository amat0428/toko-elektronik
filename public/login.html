<script>
    const SUPABASE_URL = 'https://fbnknnrltrsvydyxgujr.supabase.co';

    const SUPABASE_KEY = 'PASTE_ANON_KEY_KAMU';

    const _supabase = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const TABLE_NAME = 'users_list';


    /* =========================================
       PINDAH TAB LOGIN / REGISTER
    ========================================= */

    function switchTab(type) {

        document
            .querySelectorAll('.tab-btn')
            .forEach(btn => btn.classList.remove('active'));

        document
            .querySelectorAll('.form-container')
            .forEach(form => form.classList.remove('active'));


        if (type === 'login') {

            document
                .querySelectorAll('.tab-btn')[0]
                .classList.add('active');

            document
                .getElementById('loginForm')
                .classList.add('active');

        } else {

            document
                .querySelectorAll('.tab-btn')[1]
                .classList.add('active');

            document
                .getElementById('registerForm')
                .classList.add('active');
        }
    }


    /* =========================================
       LOGIN
    ========================================= */

    async function handleLogin(event) {

        event.preventDefault();

        const btn =
            document.getElementById('btnLogin');

        const emailInput =
            document
                .getElementById('loginEmail')
                .value
                .trim()
                .toLowerCase();

        const passwordInput =
            document
                .getElementById('loginPassword')
                .value
                .trim();


        btn.innerText = 'Memeriksa...';
        btn.disabled = true;


        try {

            /* Cari user berdasarkan email */
            const { data, error } =
                await _supabase
                    .from(TABLE_NAME)
                    .select('*')
                    .ilike('username', emailInput);


            if (error) {
                throw error;
            }


            /* Email tidak ditemukan */
            if (!data || data.length === 0) {

                alert(
                    'Email tidak ditemukan! Silakan daftar akun baru.'
                );

                return;
            }


            const user = data[0];


            /* Cek password */
            if (user.password !== passwordInput) {

                alert('Password salah!');

                return;
            }


            /* Buat session user */
            const userSession = {

                id: user.id,

                name: user.name || 'User',

                email: user.username,

                username: user.username,

                role: String(
                    user.role || 'user'
                ).toLowerCase()
            };


            /* Simpan login */
            localStorage.setItem(
                'user',
                JSON.stringify(userSession)
            );


            /* Tandai sudah login */
            localStorage.setItem(
                'isLoggedIn',
                'true'
            );


            alert(
                `Selamat datang, ${userSession.name}!`
            );


            /*
                PENTING:
                Setelah login masuk ke TOKO,
                bukan kembali ke portfolio.
            */
            window.location.href = 'toko.html';


        } catch (err) {

            alert(
                'Gagal Login: ' + err.message
            );

        } finally {

            btn.innerText = 'Masuk';

            btn.disabled = false;
        }
    }


    /* =========================================
       REGISTER
    ========================================= */

    async function handleRegister(event) {

        event.preventDefault();

        const btn =
            document.getElementById('btnRegister');


        const name =
            document
                .getElementById('regName')
                .value
                .trim();


        const email =
            document
                .getElementById('regEmail')
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById('regPassword')
                .value
                .trim();


        btn.innerText = 'Mendaftarkan...';
        btn.disabled = true;


        try {

            /* Cek email */
            const {
                data: existingUser,
                error: checkErr
            } = await _supabase
                .from(TABLE_NAME)
                .select('username')
                .ilike('username', email);


            if (checkErr) {
                throw checkErr;
            }


            if (
                existingUser &&
                existingUser.length > 0
            ) {

                alert(
                    'Email ini sudah terdaftar! Silakan login.'
                );

                switchTab('login');

                document
                    .getElementById('loginEmail')
                    .value = email;

                return;
            }


            /* Simpan user baru */
            const {
                error: insertErr
            } = await _supabase
                .from(TABLE_NAME)
                .insert([{

                    name: name,

                    username: email,

                    password: password,

                    role: 'user'

                }]);


            if (insertErr) {
                throw insertErr;
            }


            alert(
                'Pendaftaran berhasil! Silakan login.'
            );


            /* Pindah ke login */
            switchTab('login');


            document
                .getElementById('loginEmail')
                .value = email;


        } catch (err) {

            alert(
                'Gagal Mendaftar: ' + err.message
            );

        } finally {

            btn.innerText = 'Daftar Sekarang';

            btn.disabled = false;
        }
    }
</script>
