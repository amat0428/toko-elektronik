<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - BlueShop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
        }

        .tab-btn {
            position: relative;
            flex: 1;
            padding: 16px 10px;
            background: white;
            border: none;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn:hover {
            color: #2563eb;
        }

        .tab-btn.active {
            color: #2563eb;
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: #2563eb;
            border-radius: 10px;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-box {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
            background: white;
        }

        .input-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            z-index: 2;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-btn:hover {
            background: #1d4ed8;
        }

        .main-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4">
        <div class="flex items-center justify-between">

            <a
                href="index.html"
                class="flex items-center gap-2 text-xl font-bold"
            >
                <i class="fa-solid fa-bag-shopping"></i>
                <span>BlueShop</span>
            </a>

            <span class="text-sm">
                Butuh bantuan?
            </span>

        </div>
    </div>
</header>


<main class="min-h-[calc(100vh-72px)] flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-xl shadow-lg overflow-hidden">

            <div class="text-center px-6 pt-7 pb-3">

                <div class="w-16 h-16 mx-auto mb-3 bg-blue-100 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-bag-shopping text-blue-600 text-2xl"></i>
                </div>

                <h1 class="text-2xl font-bold text-gray-800">
                    BlueShop
                </h1>

                <p class="text-sm text-gray-500 mt-1">
                    Belanja elektronik lebih mudah
                </p>

            </div>


            <div class="flex border-b border-gray-200 mt-4">

                <button
                    type="button"
                    class="tab-btn active"
                    onclick="switchTab('login')"
                >
                    Masuk
                </button>

                <button
                    type="button"
                    class="tab-btn"
                    onclick="switchTab('register')"
                >
                    Daftar
                </button>

            </div>


            <div class="p-6">

                <!-- LOGIN -->

                <form
                    id="loginForm"
                    class="form-container active"
                    onsubmit="handleLogin(event)"
                >

                    <div class="space-y-4">

                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Email
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    id="loginEmail"
                                    type="email"
                                    class="input-box"
                                    placeholder="Masukkan email"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    id="loginPassword"
                                    type="password"
                                    class="input-box"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            id="btnLogin"
                            type="submit"
                            class="main-btn"
                        >
                            Masuk
                        </button>


                        <div class="flex items-center gap-3 py-1">

                            <div class="flex-1 h-px bg-gray-200"></div>

                            <span class="text-xs text-gray-400">
                                atau
                            </span>

                            <div class="flex-1 h-px bg-gray-200"></div>

                        </div>


                        <p class="text-center text-sm text-gray-500">

                            Belum punya akun?

                            <button
                                type="button"
                                onclick="switchTab('register')"
                                class="text-blue-600 font-bold hover:underline"
                            >
                                Daftar sekarang
                            </button>

                        </p>

                    </div>

                </form>


                <!-- REGISTER -->

                <form
                    id="registerForm"
                    class="form-container"
                    onsubmit="handleRegister(event)"
                >

                    <div class="space-y-4">

                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Nama Lengkap
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-user"></i>

                                <input
                                    id="regName"
                                    type="text"
                                    class="input-box"
                                    placeholder="Masukkan nama lengkap"
                                    autocomplete="name"
                                    required
                                >

                            </div>

                        </div>


                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Email
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-envelope"></i>

                                <input
                                    id="regEmail"
                                    type="email"
                                    class="input-box"
                                    placeholder="Masukkan email"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <div>

                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    id="regPassword"
                                    type="password"
                                    class="input-box"
                                    placeholder="Minimal 6 karakter"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            id="btnRegister"
                            type="submit"
                            class="main-btn"
                        >
                            Daftar Sekarang
                        </button>


                        <p class="text-center text-xs text-gray-400">
                            Dengan mendaftar, kamu menyetujui
                            ketentuan penggunaan BlueShop.
                        </p>


                        <p class="text-center text-sm text-gray-500">

                            Sudah punya akun?

                            <button
                                type="button"
                                onclick="switchTab('login')"
                                class="text-blue-600 font-bold hover:underline"
                            >
                                Masuk sekarang
                            </button>

                        </p>

                    </div>

                </form>

            </div>

        </div>


        <div class="text-center mt-5">

            <a
                href="index.html"
                class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Kembali ke Portfolio
            </a>

        </div>

    </div>

</main>


<footer class="text-center text-xs text-gray-400 pb-6">
    © 2026 BlueShop. All Rights Reserved.
</footer>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://fbnknnrltrsvydyxgujr.supabase.co";

    /*
       PENTING:

       JANGAN masukkan:
       https://fbnknnrltrsvydyxgujr.supabase.co/rest/v1/

       Yang benar hanya:
       https://fbnknnrltrsvydyxgujr.supabase.co
    */

    const SUPABASE_KEY =
        "GANTI_DENGAN_PUBLISHABLE_KEY_SUPABASE";

    const _supabase =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const TABLE_NAME = "users_list";


    // ==========================================
    // SWITCH LOGIN / REGISTER
    // ==========================================

    function switchTab(type) {

        const buttons =
            document.querySelectorAll(".tab-btn");

        const forms =
            document.querySelectorAll(".form-container");


        buttons.forEach(function(button) {
            button.classList.remove("active");
        });


        forms.forEach(function(form) {
            form.classList.remove("active");
        });


        if (type === "login") {

            buttons[0].classList.add("active");

            document
                .getElementById("loginForm")
                .classList.add("active");

        } else {

            buttons[1].classList.add("active");

            document
                .getElementById("registerForm")
                .classList.add("active");

        }

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function handleLogin(event) {

        event.preventDefault();


        const btn =
            document.getElementById("btnLogin");


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("loginPassword")
                .value
                .trim();


        if (!email || !password) {

            alert("Email dan password wajib diisi!");

            return;
        }


        btn.disabled = true;
        btn.innerText = "Memeriksa...";


        try {

            console.log("Mencoba login...");
            console.log("Supabase URL:", SUPABASE_URL);


            const {
                data,
                error
            } = await _supabase

                .from(TABLE_NAME)

                .select("*")

                .eq("username", email);


            if (error) {

                console.error("Supabase Error:", error);

                throw error;

            }


            if (!data || data.length === 0) {

                alert(
                    "Email tidak ditemukan. Silakan daftar terlebih dahulu."
                );

                return;

            }


            const user = data[0];


            if (String(user.password) !== String(password)) {

                alert("Password salah!");

                return;

            }


            const userSession = {

                id: user.id,

                name: user.name || "User",

                email: user.username,

                username: user.username,

                role: String(
                    user.role || "user"
                ).toLowerCase()

            };


            localStorage.setItem(
                "user",
                JSON.stringify(userSession)
            );


            localStorage.setItem(
                "currentUser",
                JSON.stringify(userSession)
            );


            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            console.log(
                "LOGIN BERHASIL:",
                userSession
            );


            alert(
                "Selamat datang, " +
                userSession.name +
                "!"
            );


            // LOGIN → TOKO

            window.location.href = "toko.html";

        }

        catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            alert(
                "Gagal Login:\n\n" +
                error.message
            );

        }

        finally {

            btn.disabled = false;

            btn.innerText = "Masuk";

        }

    }


    // ==========================================
    // REGISTER
    // ==========================================

    async function handleRegister(event) {

        event.preventDefault();


        const btn =
            document.getElementById("btnRegister");


        const name =
            document
                .getElementById("regName")
                .value
                .trim();


        const email =
            document
                .getElementById("regEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("regPassword")
                .value
                .trim();


        if (!name || !email || !password) {

            alert("Semua data wajib diisi!");

            return;

        }


        if (password.length < 6) {

            alert("Password minimal 6 karakter!");

            return;

        }


        btn.disabled = true;

        btn.innerText = "Mendaftarkan...";


        try {

            // CEK EMAIL

            const {
                data: existingUser,
                error: checkError
            } = await _supabase

                .from(TABLE_NAME)

                .select("username")

                .eq("username", email);


            if (checkError) {

                throw checkError;

            }


            if (
                existingUser &&
                existingUser.length > 0
            ) {

                alert(
                    "Email sudah terdaftar. Silakan login."
                );

                switchTab("login");

                document
                    .getElementById("loginEmail")
                    .value = email;

                return;

            }


            // INSERT USER

            const {
                error: insertError
            } = await _supabase

                .from(TABLE_NAME)

                .insert({

                    name: name,

                    username: email,

                    password: password,

                    role: "user"

                });


            if (insertError) {

                throw insertError;

            }


            alert(
                "Pendaftaran berhasil! Silakan login."
            );


            switchTab("login");


            document
                .getElementById("loginEmail")
                .value = email;


            document
                .getElementById("loginPassword")
                .value = "";

        }

        catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );


            alert(
                "Gagal Mendaftar:\n\n" +
                error.message
            );

        }

        finally {

            btn.disabled = false;

            btn.innerText = "Daftar Sekarang";

        }

    }

</script>

</body>
</html>
