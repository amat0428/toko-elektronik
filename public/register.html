<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar - Toko Elektronik</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md">

        <a
            href="login.html"
            class="text-xl font-bold tracking-wide flex items-center gap-2"
        >
            <i class="fa-solid fa-bag-shopping"></i>
            <span>BlueShop</span>
        </a>

        <span class="text-sm cursor-pointer hover:underline">
            Bantuan
        </span>

    </header>


    <!-- FORM REGISTER -->
    <main class="p-6 max-w-sm mx-auto w-full bg-white rounded-lg shadow-sm my-8">

        <div class="text-center mb-6">

            <h2 class="text-2xl font-bold text-gray-800">
                Daftar Akun Baru
            </h2>

            <p class="text-sm text-gray-500">
                Buat akun untuk mulai berbelanja
            </p>

        </div>


        <form
            id="registerForm"
            class="space-y-4"
        >

            <!-- NAMA -->
            <div>

                <label
                    for="regName"
                    class="block text-xs font-semibold text-gray-600 mb-1"
                >
                    NAMA LENGKAP
                </label>

                <input
                    type="text"
                    id="regName"
                    placeholder="Masukkan nama lengkap"
                    required
                    autocomplete="name"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 text-sm transition"
                >

            </div>


            <!-- USERNAME -->
            <div>

                <label
                    for="regUsername"
                    class="block text-xs font-semibold text-gray-600 mb-1"
                >
                    EMAIL / USERNAME
                </label>

                <input
                    type="text"
                    id="regUsername"
                    placeholder="Contoh: user@gmail.com"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 text-sm transition"
                >

            </div>


            <!-- PASSWORD -->
            <div>

                <label
                    for="regPassword"
                    class="block text-xs font-semibold text-gray-600 mb-1"
                >
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="regPassword"
                    placeholder="Buat password"
                    required
                    autocomplete="new-password"
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 text-sm transition"
                >

            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md hover:shadow-lg"
            >
                DAFTAR SEKARANG
            </button>

        </form>


        <!-- LOGIN -->
        <div class="mt-4 text-center text-xs text-gray-500">

            Sudah punya akun?

            <a
                href="login.html"
                class="text-blue-600 font-bold hover:underline"
            >
                Masuk/Login
            </a>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="p-4 text-center text-xs text-gray-400">

        &copy; 2026 BlueShop Toko Elektronik

    </footer>


    <!-- SCRIPT AUTH -->
    <script src="js/auth.js"></script>

</body>
</html>
