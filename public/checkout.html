<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Toko Elektronik</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Toko Elektronik</h1>
  </header>

  <main>
    <h2>Form Checkout</h2>
    <div id="checkout-summary"></div>
    <form id="checkout-form" class="form-card">
      <label>Nama Lengkap</label>
      <input type="text" id="name" required placeholder="Masukkan nama kamu">

      <label>Nomor HP/WhatsApp</label>
      <input type="tel" id="phone" required placeholder="08123456789">

      <label>Alamat Pengiriman</label>
      <textarea id="address" required placeholder="Alamat lengkap lokasi pengiriman"></textarea>

      <button type="submit" class="btn btn-primary">Konfirmasi & Bayar</button>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
