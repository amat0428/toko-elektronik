<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Toko Elektronik</title>

    <!-- Tailwind CSS Framework -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 18px 30px;
        }

        header h1 {
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .checkout-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        .summary-box {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 25px;
        }

        #checkoutItems {
            margin-bottom: 5px;
        }

        .checkout-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .checkout-item:last-child {
            border-bottom: none;
        }

        .checkout-item-info {
            flex: 1;
            min-width: 0;
        }

        .checkout-item-name {
            font-weight: 600;
            color: #222;
            margin-bottom: 6px;
        }

        .checkout-item-detail {
            color: #777;
            font-size: 14px;
        }

        .checkout-item-subtotal {
            font-weight: 700;
            white-space: nowrap;
            color: #111;
        }

        .checkout-item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
            flex-shrink: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 1px solid #ddd;
        }

        .summary-total {
            color: #0d6efd;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0d6efd;
        }

        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background: #0b5ed7;
        }

        .btn-submit:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty-checkout {
            text-align: center;
            color: #777;
            padding: 20px 0;
        }

        /* =========================
           MODAL NOTA
        ========================= */

        #notaModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .nota-box {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 25px;
        }

        .nota-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .nota-header h2 {
            margin-bottom: 5px;
        }

        .nota-info {
            margin-bottom: 20px;
        }

        .nota-info p {
            margin-bottom: 8px;
        }

        .nota-items {
            margin: 20px 0;
        }

        .nota-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            border-top: 2px solid #222;
            padding-top: 15px;
        }

        .nota-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .nota-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-print {
            background: #198754;
            color: white;
        }

        .btn-orders {
            background: #0d6efd;
            color: white;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .container {
                margin: 15px auto;
                padding: 0 12px;
            }

            .checkout-box {
                padding: 18px;
            }

            .checkout-item {
                align-items: flex-start;
            }

            .checkout-item-subtotal {
                font-size: 14px;
            }

            .summary-row {
                font-size: 16px;
            }

            .nota-buttons {
                flex-direction: column;
            }
        }

        /* =========================
           PRINT
        ========================= */

        @media print {

            body > * {
                visibility: hidden;
            }

            .nota-box,
            .nota-box * {
                visibility: visible;
            }

            .nota-box {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                max-width: none;
                box-shadow: none;
            }

            .nota-buttons {
                display: none;
            }
        }
    </style>
</head>


<body class="bg-gray-100 text-gray-800">


    <!-- =========================
         HEADER
    ========================= -->

    <header class="bg-blue-600 text-white px-6 py-5 shadow-md">

        <div class="max-w-3xl mx-auto flex items-center gap-3">

            <a
                href="cart.html"
                class="hover:text-blue-200 transition"
                title="Kembali ke keranjang"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <h1 class="text-2xl font-bold">
                Toko Elektronik
            </h1>

        </div>

    </header>


    <!-- =========================
         CHECKOUT
    ========================= -->

    <div class="container">

        <div class="checkout-box">


            <!-- JUDUL -->

            <h2 class="text-2xl font-bold text-gray-800">
                Form Checkout
            </h2>


            <!-- =========================
                 RINGKASAN PESANAN
            ========================= -->

            <div class="summary-box">

                <div id="checkoutItems">

                    <div class="empty-checkout">

                        <i class="fa-solid fa-spinner fa-spin mr-2"></i>

                        Memuat pesanan...

                    </div>

                </div>


                <!-- TOTAL -->

                <div class="summary-row">

                    <span>
                        Total Ringkasan:
                    </span>

                    <span
                        id="checkoutTotal"
                        class="summary-total"
                    >
                        Rp 0
                    </span>

                </div>

            </div>


            <!-- =========================
                 FORM CHECKOUT
            ========================= -->

            <form id="checkoutForm">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="namaLengkap">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="namaLengkap"
                        placeholder="Masukkan nama lengkap"
                        required
                        class="focus:ring-2 focus:ring-blue-500"
                    >

                </div>


                <!-- NOMOR HP -->

                <div class="form-group">

                    <label for="nomorHp">
                        Nomor HP / WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="nomorHp"
                        placeholder="Contoh: 081234567890"
                        required
                        class="focus:ring-2 focus:ring-blue-500"
                    >

                </div>


                <!-- ALAMAT -->

                <div class="form-group">

                    <label for="alamatPengiriman">
                        Alamat Pengiriman
                    </label>

                    <textarea
                        id="alamatPengiriman"
                        placeholder="Masukkan alamat lengkap"
                        required
                        class="focus:ring-2 focus:ring-blue-500"
                    ></textarea>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="btnBayar"
                    class="btn-submit bg-blue-600 hover:bg-blue-700 transition duration-200"
                >

                    <i class="fa-solid fa-credit-card mr-2"></i>

                    Bayar Sekarang

                </button>

            </form>

        </div>

    </div>


    <!-- =========================
         MODAL NOTA
    ========================= -->

    <div id="notaModal">

        <div class="nota-box shadow-2xl">


            <!-- HEADER NOTA -->

            <div class="nota-header">

                <div class="text-green-600 text-4xl mb-3">

                    <i class="fa-solid fa-circle-check"></i>

                </div>

                <h2 class="text-2xl font-bold">

                    Pesanan Berhasil

                </h2>

                <p class="text-gray-500">

                    Terima kasih telah berbelanja

                </p>

            </div>


            <!-- INFORMASI NOTA -->

            <div class="nota-info">

                <p>
                    <strong>Tanggal:</strong>
                    <span id="notaTanggal">-</span>
                </p>

                <p>
                    <strong>ID Pesanan:</strong>
                    <span id="notaOrderId">-</span>
                </p>

                <p>
                    <strong>Nama:</strong>
                    <span id="notaNama">-</span>
                </p>

                <p>
                    <strong>No. HP:</strong>
                    <span id="notaHp">-</span>
                </p>

                <p>
                    <strong>Alamat:</strong>
                    <span id="notaAlamat">-</span>
                </p>

            </div>


            <!-- DETAIL PESANAN -->

            <div class="nota-items">

                <h3
                    class="font-bold text-lg mb-3"
                >
                    Detail Pesanan
                </h3>

                <div id="notaItemsList"></div>

            </div>


            <!-- TOTAL BAYAR -->

            <div class="nota-total">

                <span>
                    Total Bayar
                </span>

                <span
                    id="notaTotalBayar"
                    class="text-blue-600"
                >
                    Rp 0
                </span>

            </div>


            <!-- BUTTON NOTA -->

            <div class="nota-buttons">

                <button
                    type="button"
                    class="btn-print hover:bg-green-700 transition"
                    onclick="cetakNota()"
                >

                    <i class="fa-solid fa-print mr-2"></i>

                    Cetak Nota

                </button>


                <button
                    type="button"
                    class="btn-orders hover:bg-blue-700 transition"
                    onclick="selesaiCheckout()"
                >

                    <i class="fa-solid fa-box mr-2"></i>

                    Lihat Pesanan

                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         CHECKOUT JAVASCRIPT
    ========================= -->

    <script src="js/checkout.js"></script>

</body>

</html>
