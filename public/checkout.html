<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Toko Elektronik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #0284c7; padding: 15px 5%; color: white; text-align: center; }
    .container { max-width: 600px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #0284c7; border-bottom: 2px solid #0284c7; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #1e293b; }
    .form-group input, .form-group textarea { 
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; 
      font-size: 14px; color: #0f172a !important; background-color: #ffffff !important; 
    }
    .summary-box { background: #f8fafc; border: 1px dashed #0284c7; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .summary-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 16px; color: #1e293b; }
    .btn-submit { background-color: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background-color: #059669; }
    .btn-submit:disabled { background-color: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>Toko Elektronik</h1>
  </header>

  <div class="container">
    <h2>Form Checkout</h2>
    
    <div class="summary-box">
      <div class="summary-row">
        <span>Total Ringkasan:</span>
        <span id="checkoutTotal">Rp 0</span>
      </div>
    </div>

    <form id="checkoutForm">
      <div class="form-group">
        <label for="namaLengkap">Nama Lengkap</label>
        <input type="text" id="namaLengkap" placeholder="Masukkan nama Anda" required>
      </div>

      <div class="form-group">
        <label for="nomorHp">Nomor HP / WhatsApp</label>
        <input type="tel" id="nomorHp" placeholder="08xxxxxxxxxx" required>
      </div>

      <div class="form-group">
        <label for="alamatPengiriman">Alamat Pengiriman</label>
        <textarea id="alamatPengiriman" rows="3" placeholder="Masukkan alamat lengkap..." required></textarea>
      </div>

      <button type="submit" id="btnBayar" class="btn-submit">Konfirmasi & Bayar</button>
    </form>
  </div>

  <!-- PANGGUL LIBRARY SUPABASE LEBIH DULU -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- BARU PANGGIL FILE CHECKOUT.JS -->
  <script src="js/checkout.js"></script>
</body>
</html>
