<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Elektronik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-16">

  <!-- Top Header & Search Bar -->
  <header class="bg-blue-600 sticky top-0 z-40 p-3 shadow-md">
    <div class="flex items-center gap-3 max-w-md mx-auto">
      <div class="flex-1 bg-white rounded-md flex items-center px-3 py-1.5 text-gray-400 text-sm shadow-inner">
        <i class="fa-solid fa-magnifying-glass mr-2 text-blue-600"></i>
        <input type="text" placeholder="Cari elektronik..." class="w-full bg-transparent outline-none text-gray-800 text-xs">
        <i class="fa-solid fa-camera ml-2 text-gray-400"></i>
      </div>
      <div class="flex gap-3 text-white text-lg">
        <a href="cart.html" class="relative">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">3</span>
        </a>
        <i class="fa-solid fa-comment-dots"></i>
      </div>
    </div>
  </header>

  <div class="max-w-md mx-auto">
    <!-- Banner Carousel -->
    <div class="bg-blue-500 p-3">
      <div class="bg-blue-400 h-36 rounded-xl flex items-center justify-between px-6 text-white shadow-inner">
        <div>
          <span class="bg-yellow-400 text-blue-900 font-extrabold text-[10px] px-2 py-0.5 rounded-full uppercase">Super Sale</span>
          <h3 class="text-xl font-black mt-1">BLUE TECH</h3>
          <p class="text-xs mt-1">Diskon S.D 90% + Gratis Ongkir</p>
        </div>
        <i class="fa-solid fa-bolt text-5xl text-yellow-300 animate-pulse"></i>
      </div>
    </div>

    <!-- Menu Grid -->
    <div class="bg-white p-4 grid grid-cols-5 gap-3 text-center text-xs mb-2 shadow-sm">
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 border border-blue-200 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg mb-1">
          <i class="fa-solid fa-truck-fast"></i>
        </div>
        <span>Gratis Ongkir</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 border border-blue-200 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg mb-1">
          <i class="fa-solid fa-bolt text-yellow-500"></i>
        </div>
        <span>Flash Sale</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 border border-blue-200 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg mb-1">
          <i class="fa-solid fa-coins text-yellow-500"></i>
        </div>
        <span>Koin Blue</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 border border-blue-200 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg mb-1">
          <i class="fa-solid fa-tv"></i>
        </div>
        <span>Elektronik</span>
      </div>
      <div class="flex flex-col items-center">
        <div class="w-10 h-10 border border-blue-200 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-lg mb-1">
          <i class="fa-solid fa-tag text-red-500"></i>
        </div>
        <span>Murah Alay</span>
      </div>
    </div>

    <!-- Rekomendasi Produk -->
    <div class="p-2">
      <div class="flex items-center justify-center my-3">
        <div class="h-0.5 w-12 bg-blue-600"></div>
        <span class="px-3 font-bold text-blue-600 text-sm uppercase">Rekomendasi</span>
        <div class="h-0.5 w-12 bg-blue-600"></div>
      </div>

      <!-- Container Produk yang di-render lewat JS -->
      <div id="product-list" class="grid grid-cols-2 gap-2">
        <!-- Card Produk Contoh -->
        <a href="product-detail.html" class="bg-white rounded-md overflow-hidden shadow-sm block">
          <div class="h-36 bg-gray-200 flex items-center justify-center text-gray-400 relative">
            <i class="fa-solid fa-laptop text-4xl"></i>
            <span class="absolute bottom-1 left-1 bg-blue-100 text-blue-700 text-[9px] font-bold px-1 rounded">Star+</span>
          </div>
          <div class="p-2">
            <p class="product-title text-xs text-gray-700 mb-2">Laptop Gaming Intel Core i7 RAM 16GB</p>
            <div class="product-price-row">
              <span class="text-xs text-blue-600 font-bold">Rp12.499.000</span>
            </div>
            <div class="flex items-center gap-1 text-[10px] text-gray-400 mt-1">
              <i class="fa-solid fa-star text-yellow-400"></i>
              <span>4.9</span>
              <span>|</span>
              <span>100+ Terjual</span>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-1.5 z-40 max-w-md mx-auto">
    <div class="flex justify-around items-center text-gray-500">
      <a href="index.html" class="flex flex-col items-center text-blue-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-0.5">Beranda</span>
      </a>
      <a href="products.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] mt-0.5">Kategori</span>
      </a>
      <a href="orders.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-receipt text-lg"></i>
        <span class="text-[10px] mt-0.5">Pesanan</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] mt-0.5">Saya</span>
      </a>
    </div>
  </nav>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
