<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueShop - Toko Utama</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; }
    header { background-color: #2563eb; padding: 12px 5%; color: white; position: sticky; top: 0; z-index: 900; }
    .nav-container { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .logo { font-size: 22px; font-weight: bold; cursor: pointer; text-decoration: none; color: white; }
    .search-box { flex: 1; max-width: 350px; }
    .search-box input { width: 100%; padding: 8px 15px; border-radius: 6px; border: none; outline: none; }
    .nav-links { display: flex; gap: 12px; align-items: center; font-size: 14px; }
    .btn-nav { background: rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; cursor: pointer; position: relative; font-size: 13px; }
    .btn-nav:hover { background: rgba(255,255,255,0.3); }
    .badge-count { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; position: absolute; top: -5px; right: -5px; font-weight: bold; }
    .role-badge { background: #10b981; color: white; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 13px; }
    .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    
    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .hero-banner { background: linear-gradient(135deg, #1d4ed8, #60a5fa); color: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
    .section-title { font-size: 16px; font-weight: bold; color: #1e293b; border-bottom: 2px solid #2563eb; display: inline-block; padding-bottom: 4px; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .product-card { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 10px; }
    .product-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .product-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-name { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .product-price { color: #dc2626; font-size: 15px; font-weight: bold; margin-bottom: 8px; }
    .product-rating { color: #f59e0b; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    
    .btn-buy { background: #2563eb; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px; text-decoration: none; display: block; text-align: center; font-size: 13px; }
    .btn-add-cart { background: #f59e0b; color: white; border: none; padding: 6px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-bottom: 5px; }
    .btn-rate { background: #8b5cf6; color: white; border: none; padding: 6px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }

    .admin-actions { margin-top: 8px; display: flex; gap: 5px; }
    .btn-edit { background: #10b981; color: white; border: none; padding: 5px; flex: 1; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 5px; flex: 1; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; max-height: 85vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: #64748b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🛍️ BlueShop</a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari produk..." oninput="filterProducts()">
      </div>
      <div class="nav-links">
        <a href="cart.html" class="btn-nav">🛒 Keranjang <span class="badge-count" id="cartBadge">0</span></a>
        <a href="orders.html" class="btn-nav">📦 Pesanan <span class="badge-count" id="orderBadge" style="background:#0284c7">0</span></a>
        <div class="role-badge" id="roleBadge">Loading...</div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="hero-banner">
      <h2>BLUE TECH STORE</h2>
      <p>Pusat Belanja Produk Elektronik</p>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <span class="section-title" id="sectionTitle">DAFTAR PRODUK</span>
      <button class="btn-save" id="btnAddProductNav" onclick="openProductModal(false)" style="display: none;">+ Tambah Produk Baru</button>
    </div>

    <div class="product-grid" id="productGrid">
      <p style="grid-column: 1/-1; text-align: center;">Memuat produk...</p>
    </div>
  </div>

  <!-- Modal Rating -->
  <div class="modal" id="ratingModal">
    <div class="modal-content">
      <h3>Beri Rating & Ulasan</h3>
      <input type="hidden" id="ratingProductId">
      <div class="form-group" style="margin-top:10px;">
        <label>Rating (Bintang)</label>
        <select id="ratingScore">
          <option value="5">⭐⭐⭐⭐⭐ (5 - Sangat Bagus)</option>
          <option value="4">⭐⭐⭐⭐ (4 - Bagus)</option>
          <option value="3">⭐⭐⭐ (3 - Cukup)</option>
          <option value="2">⭐⭐ (2 - Kurang)</option>
          <option value="1">⭐ (1 - Buruk)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Ulasan Anda</label>
        <textarea id="ratingComment" rows="3" placeholder="Tulis pendapat kamu..."></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeRatingModal()">Batal</button>
        <button class="btn-save" onclick="submitRating()" style="background:#8b5cf6;">Kirim Ulasan</button>
      </div>
    </div>
  </div>

  <!-- Modal Form CRUD Admin -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h3 id="productModalTitle">Tambah Produk Baru</h3>
      <form onsubmit="event.preventDefault(); saveProduct();">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="productName" required>
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="productPrice" min="0" required>
        </div>
        <div class="form-group">
          <label>URL Gambar</label>
          <input type="url" id="productImage" required>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeProductModal()">Batal</button>
          <button type="submit" class="btn-save">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fbnknnrltrsvydyxgujr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZibmtubnJsdHJzdnlkeXhndWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDA0MjYsImV4cCI6MjEwMzgxNjQyNn0.A46kddQQFKt8C-Kvq8Gt753acdEctsh7XibfMWKKP9o';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let ratings = JSON.parse(localStorage.getItem('blueshop_ratings')) || {};
    let currentUser = null;
    let isAdmin = false;

    document.addEventListener('DOMContentLoaded', () => {
      checkUserRole();
      fetchProducts();
      updateBadges();
    });

    function checkUserRole() {
      const userData = localStorage.getItem('user');
      if (!userData) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = JSON.parse(userData);
      isAdmin = (currentUser.role || '').toLowerCase() === 'admin';

      const badge = document.getElementById('roleBadge');
      const btnAddNav = document.getElementById('btnAddProductNav');
      const title = document.getElementById('sectionTitle');

      if (isAdmin) {
        badge.innerText = '🛡️ Admin (CRUD Active)';
        badge.style.background = '#10b981';
        btnAddNav.style.display = 'block';
        title.innerText = 'DAFTAR PRODUK (KONTROL ADMIN)';
      } else {
        badge.innerText = `👤 User: ${currentUser.name || 'User'}`;
        badge.style.background = '#0284c7';
        btnAddNav.style.display = 'none';
        title.innerText = 'DAFTAR PRODUK';
      }
    }

    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    async function fetchProducts() {
      let { data, error } = await _supabase.from('produk').select('*').order('id_produk', { ascending: false });

      if (error) {
        const fallback = await _supabase.from('products').select('*');
        data = fallback.data;
      }

      allProducts = data || [];
      renderProducts(allProducts);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Tidak ada produk tersedia.</p>';
        return;
      }

      products.forEach(p => {
        const id = p.id_produk || p.id;
        const name = p.nama_produk || p.name;
        const price = p.harga || p.price;
        const image = p.gambar || p.image;
        const currentRating = ratings[id] ? `${ratings[id]} ⭐` : 'Belum Ada Rating';

        const adminActionsHTML = isAdmin ? `
          <div class="admin-actions">
            <button class="btn-edit" onclick="editProduct(${id})">Edit</button>
            <button class="btn-delete" onclick="deleteProduct(${id})">Hapus</button>
          </div>
        ` : '';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${image}" class="product-img" onerror="this.src='https://via.placeholder.com/300?text=Produk'">
          <div class="product-details">
            <div>
              <div class="product-name">${name}</div>
              <div class="product-price">Rp ${Number(price).toLocaleString('id-ID')}</div>
              <div class="product-rating">${ratings[id] ? '⭐ ' : ''}${currentRating}</div>
            </div>
            <div>
              <button class="btn-buy" onclick="buyNow(${id})">Beli Langsung</button>
              <button class="btn-add-cart" onclick="addToCart(${id})">+ Keranjang</button>
              <button class="btn-rate" onclick="openRatingModal(${id})">⭐ Beri Rating</button>
            </div>
            ${adminActionsHTML}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(id) {
      const p = allProducts.find(item => (item.id_produk || item.id) == id);
      if (!p) return;
      
      const existing = cart.find(item => item.id == id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: id,
          title: p.nama_produk || p.name,
          price: Number(p.harga || p.price),
          image: p.gambar || p.image,
          qty: 1,
          selected: true
        });
      }
      saveCart();
      alert("Produk dimasukkan ke keranjang!");
    }

    function buyNow(id) {
      addToCart(id);
      window.location.href = 'cart.html';
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
      updateBadges();
    }

    async function updateBadges() {
      document.getElementById('cartBadge').innerText = cart.reduce((sum, i) => sum + i.qty, 0);

      if (currentUser) {
        const { data } = await _supabase.from('orders').select('id').eq('user_id', currentUser.id);
        if (data) {
          document.getElementById('orderBadge').innerText = data.length;
        }
      }
    }

    function openRatingModal(id) {
      document.getElementById('ratingProductId').value = id;
      document.getElementById('ratingModal').style.display = 'flex';
    }
    function closeRatingModal() { document.getElementById('ratingModal').style.display = 'none'; }

    function submitRating() {
      const id = document.getElementById('ratingProductId').value;
      const score = document.getElementById('ratingScore').value;
      ratings[id] = score;
      localStorage.setItem('blueshop_ratings', JSON.stringify(ratings));
      alert("Terima kasih atas rating & ulasan Anda!");
      closeRatingModal();
      fetchProducts();
    }

    function openProductModal(isEdit) {
      document.getElementById('productModal').style.display = 'flex';
      if (!isEdit) {
        document.getElementById('productModalTitle').innerText = 'Tambah Produk Baru';
        document.getElementById('productId').value = '';
        document.getElementById('productName').value = '';
        document.getElementById('productPrice').value = '';
        document.getElementById('productImage').value = '';
      }
    }
    function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }

    async function saveProduct() {
      const id = document.getElementById('productId').value;
      const nama_produk = document.getElementById('productName').value.trim();
      const harga = Number(document.getElementById('productPrice').value);
      const gambar = document.getElementById('productImage').value.trim();

      if (id) {
        await _supabase.from('produk').update({ nama_produk, harga, gambar }).eq('id_produk', id);
      } else {
        await _supabase.from('produk').insert([{ nama_produk, harga, gambar, stok: 100 }]);
      }
      closeProductModal();
      fetchProducts();
    }

    function editProduct(id) {
      const p = allProducts.find(item => (item.id_produk || item.id) == id);
      if (p) {
        document.getElementById('productModalTitle').innerText = 'Edit Produk';
        document.getElementById('productId').value = p.id_produk || p.id;
        document.getElementById('productName').value = p.nama_produk || p.name;
        document.getElementById('productPrice').value = p.harga || p.price;
        document.getElementById('productImage').value = p.gambar || p.image;
        openProductModal(true);
      }
    }

    async function deleteProduct(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        await _supabase.from('produk').delete().eq('id_produk', id);
        fetchProducts();
      }
    }

    function filterProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(allProducts.filter(p => (p.nama_produk || p.name || '').toLowerCase().includes(keyword)));
    }
  </script>
</body>
</html>
